no', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Layout<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Full-bleed <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-card border-y border-border<\u002Fspan>; container inside. Padding <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">py-10 md:py-14 xl:py-16<\u002Fspan> — deliberately shorter than a standard block, because this band is a caption on the hero, not a section. Grid: 1 col mobile / 2 cols at <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">md<\u002Fspan> / 4 cols at <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">xl<\u002Fspan> — <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">grid-cols-1 md:grid-cols-2 xl:grid-cols-4<\u002Fspan>. Separation is a 1px <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border-border<\u002Fspan> divider, not a gap: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">divide-y md:divide-y-0 md:divide-x<\u002Fspan> with <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">px-0 md:px-8<\u002Fspan> and <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">py-6 md:py-0<\u002Fspan> per cell. At <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">md<\u002Fspan> the 2×2 grid needs a horizontal divider between rows too (<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">md:divide-y<\u002Fspan> on the row wrapper); first cell in each row drops its left border.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Type<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">value<\u002Fspan>: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-[40px] md:text-5xl xl:text-[56px] font-extrabold leading-none tracking-[-0.04em] tabular-nums text-foreground<\u002Fspan>. It is Geist, not mono — the number is a headline. <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">label<\u002Fspan>: 15px/600 <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-foreground<\u002Fspan>, 14px above. <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">description<\u002Fspan>: 13.5px/1.55 <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground max-w-[30ch]<\u002Fspan>, 8px above.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">String values<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">value<\u002Fspan> is a string and is rendered as one: no <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">min-w<\u002Fspan>, no fixed digit count, no count-up animation. Cells are <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">items-start<\u002Fspan> and values are top-aligned to the cell, not baseline-aligned to each other, so <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">\"0\"<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">\"12\"<\u002Fspan> and <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">\"~30s\"<\u002Fspan> all sit correctly (see the mixed-width strip above). Values longer than 6 characters drop to <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-4xl<\u002Fspan> — a length the seed never reaches, but the template must survive it. Never suffix or prefix a unit in the renderer; the unit belongs in the string.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Empty &amp; overflow<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">No <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">heading<\u002Fspan> (the home case): the grid is the whole section, no top spacing added. With a heading, the standard left-aligned section header sits 40px above the grid and the band keeps its <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-card<\u002Fspan>. Blank <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">description<\u002Fspan>: cell is value + label only; siblings do not stretch to match — ragged cell heights are correct here because the divider is vertical. 1 item: single cell, left-aligned, no dividers, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">md:grid-cols-2<\u002Fspan> leaves the right half empty rather than centring. 5–12 items: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">xl:grid-cols-4<\u002Fspan> wraps to further rows; row 2+ gets a top divider. No entrance animation on this block.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"features\" style=\"margin-bottom: 96px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">07 — Features<\u002Fdiv>\n    <h2 style=\"margin: 0 0 28px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">Six cards, hairline-joined.<\u002Fh2>\n\n    <div style=\"background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 4px; overflow: hidden; margin-bottom: 24px;\">\n      <div style=\"display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid #2A2A2A; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\"><span>Specimen · 6 items<\u002Fspan><span>3 cols · gap-px hairline<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 56px 40px;\">\n        <div style=\"max-width: 36rem; margin-bottom: 40px;\">\n          <h3 style=\"margin: 0; color: #F4F4F4; font-size: 34px; font-weight: 700; line-height: 1.18; letter-spacing: -0.025em;\">Built for the way you already work.<\u002Fh3>\n          <p style=\"margin: 16px 0 0; color: #A0A0A0; font-size: 17px; line-height: 1.6;\">Familiar collection patterns, with the generation step done for you.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #2A2A2A; border: 1px solid #2A2A2A; border-radius: 4px; overflow: hidden;\">\n          <div style=\"background: #0A0A0A; padding: 24px;\">\n            <div style=\"width: 32px; height: 32px; border: 1px solid #2A2A2A; border-radius: 2px; display: flex; align-items: center; justify-content: center; color: #F07040; font-size: 15px; margin-bottom: 16px;\">✦<\u002Fdiv>\n            <div style=\"color: #F4F4F4; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;\">Convex-native codegen<\u002Fdiv>\n            <p style=\"margin: 8px 0 0; color: #A0A0A0; font-size: 14px; line-height: 1.6;\">vex dev writes your Convex schema, TypeScript interfaces, and Zod validators straight from <span>define<\u002Fspan><span>Collection<\u002Fspan>(). There is no hand-maintained schema.ts<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: #0A0A0A; padding: 24px;\">\n            <div style=\"width: 32px; height: 32px; border: 1px solid #2A2A2A; border-radius: 2px; display: flex; align-items: center; justify-content: center; color: #F07040; font-size: 15px; margin-bottom: 16px;\">◆<\u002Fdiv>\n            <div style=\"color: #F4F4F4; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;\">End-to-end types<\u002Fdiv>\n            <p style=\"margin: 8px 0 0; color: #A0A0A0; font-size: 14px; line-height: 1.6;\">Fields, relationships, and query return types are checked from the database to the component. Rename a field and the compiler names every call site<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: #0A0A0A; padding: 24px;\">\n            <div style=\"width: 32px; height: 32px; border: 1px solid #2A2A2A; border-radius: 2px; display: flex; align-items: center; justify-content: center; color: #F07040; font-size: 15px; margin-bottom: 16px;\">◉<\u002Fdiv>\n            <div style=\"color: #F4F4F4; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;\">Real-time admin panel<\u002Fdiv>\n            <p style=\"margin: 8px 0 0; color: #A0A0A0; font-size: 14px; line-height: 1.6;\">Every list view is a Convex subscription. Pagination, live <span>total<\u002Fspan><span>Docs<\u002Fspan>, and bulk operations update without a refetch<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: #0A0A0A; padding: 24px;\">\n            <div style=\"width: 32px; height: 32px; border: 1px solid #2A2A2A; border-radius: 2px; display: flex; align-items: center; justify-content: center; color: #F07040; font-size: 15px; margin-bottom: 16px;\">⌂<\u002Fdiv>\n            <div style=\"color: #F4F4F4; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;\">RBAC with indexed access<\u002Fdiv>\n            <p style=\"margin: 8px 0 0; color: #A0A0A0; font-size: 14px; line-height: 1.6;\">Document-level rules with { constraints } that compile to <span>with<\u002Fspan><span>Index<\u002Fspan> ranges inside the query, plus per-call overrides and an anonymous-role fallback<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: #0A0A0A; padding: 24px;\">\n            <div style=\"width: 32px; height: 32px; border: 1px solid #2A2A2A; border-radius: 2px; display: flex; align-items: center; justify-content: center; color: #F07040; font-size: 15px; margin-bottom: 16px;\">▤<\u002Fdiv>\n            <div style=\"color: #F4F4F4; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;\">Globals and themes<\u002Fdiv>\n            <p style=\"margin: 8px 0 0; color: #A0A0A0; font-size: 14px; line-height: 1.6;\"><span>define<\u002Fspan><span>Global<\u002Fspan>() gives you singletons like site settings. Themes are a collection — 32 shadcn tokens × light and dark, stored as oklch and applied on first paint<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: #0A0A0A; padding: 24px;\">\n            <div style=\"width: 32px; height: 32px; border: 1px solid #2A2A2A; border-radius: 2px; display: flex; align-items: center; justify-content: center; color: #F07040; font-size: 15px; margin-bottom: 16px;\">▦<\u002Fdiv>\n            <div style=\"color: #F4F4F4; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;\">Page-builder blocks<\u002Fdiv>\n            <p style=\"margin: 8px 0 0; color: #A0A0A0; font-size: 14px; line-height: 1.6;\">A blocks field composes typed content blocks into a discriminated union. Each block is a config plus a React renderer, colocated<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 168px 1fr; gap: 0 24px; font-size: 14px; line-height: 1.6;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Layout<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Standard padding <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">py-14 md:py-20 xl:py-28<\u002Fspan>, container, left section header at <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">max-w-[36rem]<\u002Fspan>, 40px above the grid. Grid <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">grid-cols-1 md:grid-cols-2 xl:grid-cols-3<\u002Fspan>. Instead of a gap the grid is a hairline mesh: wrapper <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">gap-px bg-border border border-border rounded-md overflow-hidden<\u002Fspan>, each cell <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-background p-6<\u002Fspan>. That is the deviation from the sourced Tailark card grid and it is deliberate: 1px seams read as precision tooling, and they remove six drop shadows that dark mode is not allowed to have.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Card interior<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Icon frame 32px, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border border-border rounded-sm<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Icon size-4 text-primary<\u002Fspan> centred, 16px above the title. Title 17px/600 (<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">xl:text-lg<\u002Fspan>) <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-foreground<\u002Fspan>. Description 14px/1.6 <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground<\u002Fspan>, 8px above, no measure cap (the cell is the measure), <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-wrap: pretty<\u002Fspan>. Cells stretch to the tallest in the row; content is top-aligned. This is the one place ember appears six times on a page — permitted because the icon is 16px and monochrome elsewhere.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Icons<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Lucide names, verified against <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">icons<\u002Fspan>: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Wand<\u002Fspan> · <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">ShieldCheck<\u002Fspan> · <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Radio<\u002Fspan> · <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Lock<\u002Fspan> · <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Boxes<\u002Fspan> · <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">LayoutGrid<\u002Fspan>. Blank or unresolvable <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">icon<\u002Fspan>: the 32px frame is dropped entirely (not left empty) and the title moves to the top of the cell. A mixed array — some icons, some not — is a valid state and looks intentional because titles stay top-aligned.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">States<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Cards are not links and take no hover. If a future <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">href<\u002Fspan> field is added, hover is <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-accent<\u002Fspan> on the cell and nothing else — no lift, no border colour change.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Empty &amp; overflow<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">1 item: one full-width cell — acceptable, because the mesh border makes it read as a panel rather than a stranded card. 2 items at <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">xl<\u002Fspan>: two cells, third column empty; do not centre. 12 items: 4 rows of 3, no pagination, no \"show more\". Blank subheading: header gap 32px. A three-line h2 is fine — <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">max-w-[36rem]<\u002Fspan> makes it likely and the 40px gap below is fixed.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"codeshowcase\" style=\"margin-bottom: 96px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">08 — CodeShowcase · new · the argument<\u002Fdiv>\n    <h2 style=\"margin: 0 0 16px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">The config, and the file it wrote.<\u002Fh2>\n    <p style=\"margin: 0 0 32px; font-size: 15px; line-height: 1.65; color: #2E2E2E; max-width: 64ch; text-wrap: pretty;\">This is the most important section on the site, so it gets the most chrome discipline: two panes, identical height, one seam between them, the generated pane visually marked as machine output. Highlighting is shiki at render time in a server component — the client ships no highlighter.<\u002Fp>\n\n    <div style=\"background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 4px; overflow: hidden; margin-bottom: 24px;\">\n      <div style=\"display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid #2A2A2A; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\"><span>Specimen · 2 panes<\u002Fspan><span>side by side · shared frame<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 56px 40px;\">\n        <div style=\"max-width: 36rem; margin-bottom: 40px;\">\n          <h3 style=\"margin: 0; color: #F4F4F4; font-size: 34px; font-weight: 700; line-height: 1.18; letter-spacing: -0.025em;\">Write the config. Get the types.<\u002Fh3>\n          <p style=\"margin: 16px 0 0; color: #A0A0A0; font-size: 17px; line-height: 1.6;\">Two files from this site. The left one is hand-written; the right one is generated by vex dev and never edited.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border: 1px solid #2A2A2A; border-radius: 4px; overflow: hidden; display: grid; grid-template-columns: minmax(0,1fr) 1px minmax(0,1fr); background: #2A2A2A;\">\n          <div style=\"background: #111111; min-width: 0;\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 40px; padding: 0 14px; border-bottom: 1px solid #2A2A2A; background: #141414;\">\n              <div style=\"display: flex; align-items: center; gap: 10px; min-width: 0;\">\n                <span style=\"color: #F07040; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;\">You write<\u002Fspan>\n                <span style=\"color: #717171; font-family: 'Geist Mono', monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">src/vexcms/blocks/Features/config.ts<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 6px;\">\n                <span style=\"color: #717171; font-family: 'Geist Mono', monospace; font-size: 11px; border: 1px solid #2A2A2A; border-radius: 2px; padding: 2px 6px;\">ts<\u002Fspan>\n                <span style=\"display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 2px; color: #717171; font-size: 11px;\">⧉<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <pre style=\"margin: 0; padding: 18px 16px; font-family: 'Geist Mono', monospace; font-size: 12.5px; line-height: 1.7; color: #C7C7C7; overflow-x: auto;\"><span style=\"color: #F07040;\">export const<\u002Fspan> <span style=\"color: #C7C7C7;\">features<\u002Fspan><span style=\"color: #C7C7C7;\">Block<\u002Fspan> = <span style=\"color: #F4F4F4;\">defineBlock<\u002Fspan>({\n  slug: BLOCK_SLUG_FEATURES,\n  label: <span style=\"color: #A0A0A0;\">\"Features\"<\u002Fspan>,\n  fields: {\n    heading: <span style=\"color: #F4F4F4;\">text<\u002Fspan>({ label: <span style=\"color: #A0A0A0;\">\"Heading\"<\u002Fspan>, required: <span style=\"color: #F07040;\">true<\u002Fspan> }),\n    subheading: <span style=\"color: #F4F4F4;\">text<\u002Fspan>({ label: <span style=\"color: #A0A0A0;\">\"Subheading\"<\u002Fspan> }),\n    features: <span style=\"color: #F4F4F4;\">array<\u002Fspan>({\n      label: <span style=\"color: #A0A0A0;\">\"Features\"<\u002Fspan>,\n      required: <span style=\"color: #F07040;\">true<\u002Fspan>,\n      items: <span style=\"color: #F4F4F4;\">group<\u002Fspan>({\n        fields: {\n          title: <span style=\"color: #F4F4F4;\">text<\u002Fspan>({ label: <span style=\"color: #A0A0A0;\">\"Title\"<\u002Fspan>, required: <span style=\"color: #F07040;\">true<\u002Fspan> }),\n          description: <span style=\"color: #F4F4F4;\">text<\u002Fspan>({ required: <span style=\"color: #F07040;\">true<\u002Fspan> }),\n          icon: <span style=\"color: #F4F4F4;\">text<\u002Fspan>({ label: <span style=\"color: #A0A0A0;\">\"Icon\"<\u002Fspan> }),\n        },\n      }),\n    }),\n  },\n  admin: { icon: <span style=\"color: #A0A0A0;\">\"LayoutGrid\"<\u002Fspan> },\n})<\u002Fpre>\n          <\u002Fdiv>\n          <div><\u002Fdiv>\n          <div style=\"background: #111111; min-width: 0;\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 40px; padding: 0 14px; border-bottom: 1px solid #2A2A2A; background: #141414;\">\n              <div style=\"display: flex; align-items: center; gap: 10px; min-width: 0;\">\n                <span style=\"color: #717171; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;\">Vex generates<\u002Fspan>\n                <span style=\"color: #717171; font-family: 'Geist Mono', monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">src/vex.types.ts<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 6px;\">\n                <span style=\"color: #717171; font-family: 'Geist Mono', monospace; font-size: 11px; border: 1px solid #2A2A2A; border-radius: 2px; padding: 2px 6px;\">ts<\u002Fspan>\n                <span style=\"display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 2px; color: #717171; font-size: 11px;\">⧉<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <pre style=\"margin: 0; padding: 18px 16px; font-family: 'Geist Mono', monospace; font-size: 12.5px; line-height: 1.7; color: #C7C7C7; overflow-x: auto;\"><span style=\"color: #6E6E6E;\">/* AUTO-GENERATED BY VEX CMS — DO NOT EDIT */\n\n<\u002Fspan><span style=\"color: #F07040;\">export type<\u002Fspan> <span style=\"color: #F4F4F4;\">FeaturesBlock<\u002Fspan> = {\n  blockType: <span style=\"color: #A0A0A0;\">\"features\"<\u002Fspan>\n  blockName?: <span style=\"color: #F07040;\">string<\u002Fspan>\n  id: <span style=\"color: #F07040;\">string<\u002Fspan>\n  heading: <span style=\"color: #F07040;\">string<\u002Fspan>\n  subheading?: <span style=\"color: #F07040;\">string<\u002Fspan>\n  features: {\n    title: <span style=\"color: #F07040;\">string<\u002Fspan>\n    description: <span style=\"color: #F07040;\">string<\u002Fspan>\n    <span style=\"color: #6E6E6E;\">/**\n     * Lucide icon name\n     */<\u002Fspan>\n    icon?: <span style=\"color: #F07040;\">string<\u002Fspan>\n  }[]\n}<\u002Fpre>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 0; margin-top: 12px;\">\n          <div style=\"flex: 1; color: #717171; font-size: 13px; line-height: 1.55; padding-right: 24px;\">One declaration, twenty-two lines.<\u002Fdiv>\n          <div style=\"flex: 1; color: #717171; font-size: 13px; line-height: 1.55; padding-left: 24px;\">Regenerated on every save. Never edited by hand.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top: 1px solid #2A2A2A; padding: 24px 40px 32px;\">\n        <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171; margin-bottom: 14px;\">3+ panes → tab set<\u002Fdiv>\n        <div style=\"border: 1px solid #2A2A2A; border-radius: 4px; overflow: hidden;\">\n          <div style=\"display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 8px; border-bottom: 1px solid #2A2A2A; background: #141414;\">\n            <span style=\"color: #F4F4F4; font-size: 13px; font-weight: 500; padding: 5px 12px; border-radius: 2px; background: #1E1E1E; box-shadow: inset 0 -1px 0 #F07040;\">Collection<\u002Fspan>\n            <span style=\"color: #A0A0A0; font-size: 13px; font-weight: 500; padding: 5px 12px; border-radius: 2px;\">Access rule<\u002Fspan>\n            <span style=\"color: #A0A0A0; font-size: 13px; font-weight: 500; padding: 5px 12px; border-radius: 2px;\">Generated query<\u002Fspan>\n            <span style=\"margin-left: auto; color: #717171; font-family: 'Geist Mono', monospace; font-size: 12px; padding-right: 8px;\">convex/collections/posts.ts<\u002Fspan>\n          <\u002Fdiv>\n          <pre style=\"margin: 0; padding: 18px 16px; font-family: 'Geist Mono', monospace; font-size: 12.5px; line-height: 1.7; color: #C7C7C7; background: #111111; overflow-x: auto;\"><span style=\"color: #F07040;\">export const<\u002Fspan> posts = <span style=\"color: #F4F4F4;\">defineCollection<\u002Fspan>({ slug: <span style=\"color: #A0A0A0;\">\"posts\"<\u002Fspan>, fields: { title: <span style=\"color: #F4F4F4;\">text<\u002Fspan>({ required: <span style=\"color: #F07040;\">true<\u002Fspan> }) } })<\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 168px 1fr; gap: 0 24px; font-size: 14px; line-height: 1.6;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Layout<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Standard padding, container, left section header. Two panes: one shared frame — <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border border-border rounded-md overflow-hidden<\u002Fspan> — split <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">grid xl:grid-cols-[1fr_1px_1fr]<\u002Fspan> with a <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-border<\u002Fspan> seam, so the pairing reads as one artefact rather than two cards. Below <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">xl<\u002Fspan> the panes stack (<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">grid-cols-1<\u002Fspan>) with a horizontal seam and the second pane keeps its own chrome bar — the reading order (write → generate) is preserved. <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">items-stretch<\u002Fspan>; panes match height, the shorter one padding out with pane background, never with filler code.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Pane chrome<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Bar <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">h-10<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-card border-b border-border px-3.5<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">flex items-center justify-between gap-3<\u002Fspan>. Left: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">label<\u002Fspan> as 11px/500/+0.08em uppercase — <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-primary<\u002Fspan> on the authored pane, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground<\u002Fspan> on every other pane (that single colour difference is the whole \"hand-written vs generated\" signal); then <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">filename<\u002Fspan> in mono 12px <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground truncate<\u002Fspan>. Right: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">language<\u002Fspan> chip, mono 11px, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border border-border rounded-sm px-1.5 py-0.5<\u002Fspan>, lowercase as authored; then the copy button, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">size=\"icon-xs\" variant=\"ghost\"<\u002Fspan>, same copied-state behaviour as the hero install row. Below <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">sm<\u002Fspan> the filename hides before the chip does.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Code body<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Surface <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-[--color-code-bg]<\u002Fspan> (a non-theme <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">@theme<\u002Fspan> token, §D) — code stays dark in both themes on purpose. <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">p-4<\u002Fspan> mobile / <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">px-4 py-[18px]<\u002Fspan> desktop, mono 12.5px desktop and 12px mobile, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">leading-[1.7]<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">tab-size: 2<\u002Fspan>. No line numbers — they add 40px of noise and nothing is ever referenced by line. No traffic-light dots.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Long lines<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Never wrapped, never truncated: the <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">pre<\u002Fspan> is <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">overflow-x-auto overscroll-x-contain<\u002Fspan> with <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">white-space: pre<\u002Fspan>, and each pane scrolls independently. The scrollbar is styled thin with a <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">--color-code-border<\u002Fspan> thumb and only occupies space when needed. Panes cap at <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">max-h-[560px]<\u002Fspan> (<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">420px<\u002Fspan> below <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">md<\u002Fspan>) and then scroll vertically inside the frame; the frame itself never grows past that, so a 400-line paste cannot destroy the page rhythm. Mandatory grid guard: the split is <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">grid-cols-[minmax(0,1fr)_1px_minmax(0,1fr)]<\u002Fspan> and both pane columns carry <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">min-w-0<\u002Fspan>. Without it a <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">1fr<\u002Fspan> track resolves to <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">minmax(auto,1fr)<\u002Fspan>, the <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">pre<\u002Fspan>'s longest line sets the min-content width, the columns overflow the frame, and <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">overflow-x-auto<\u002Fspan> never engages — the code is clipped instead of scrolling. Same guard on the tab-mode panel and on the Split <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">media: \"code\"<\u002Fspan> column. Horizontal scroll containers get <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">tabindex=\"0\"<\u002Fspan> and a <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">role=\"region\"<\u002Fspan> label so keyboard users can reach them.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Caption<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Optional <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">caption<\u002Fspan> sits <em>outside<\u002Fem> the frame, 12px below, 13px/1.55 <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground<\u002Fspan>, aligned to its own pane's column. If no pane has a caption the row is not rendered. If one of two has one, the other column stays empty — captions are per-pane annotations, not a shared footer.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">3+ panes<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Tabs<\u002Fspan> from <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">@vexcms/react<\u002Fspan>, one <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">TabsTrigger<\u002Fspan> per pane using <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">label<\u002Fspan>. The <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">TabsList<\u002Fspan> replaces the chrome bar inside the same frame: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">h-10 bg-card border-b border-border px-2<\u002Fspan>, triggers 13px/500 <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">rounded-sm px-3 py-[5px]<\u002Fspan>, rest <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground<\u002Fspan>, hover <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-foreground<\u002Fspan>, selected <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-background text-foreground<\u002Fspan> with a 1px <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-primary<\u002Fspan> underline via <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">inset shadow<\u002Fspan>. The active pane's filename moves to the right end of the list. Tab panels are all rendered server-side and hidden with <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">hidden<\u002Fspan>, so switching costs no request; the frame takes the tallest pane's height to stop the page jumping. One pane: the frame renders alone, full width, no tabs. Zero panes: the block renders nothing at all, not an empty frame.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Sourcing note<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Magic UI's <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">code-comparison<\u002Fspan> supplies the shiki-in-a-server-component approach and the two-pane frame; its <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">next-themes<\u002Fspan> hook is dropped (shiki is invoked once with the dark theme because the pane is always dark), its filename-bar icons are dropped, and its diff highlighting is not used — this section compares two files, not two revisions.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"split\" style=\"margin-bottom: 96px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">09 — Split · new<\u002Fdiv>\n    <h2 style=\"margin: 0 0 28px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">Argument left, evidence right. Then swap.<\u002Fh2>\n\n    <div style=\"background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 4px; overflow: hidden; margin-bottom: 24px;\">\n      <div style=\"display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid #2A2A2A; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\"><span>Specimen · media \"code\", position right<\u002Fspan><span>12-col · 5 / 1 / 6<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 56px 40px;\">\n        <div style=\"display: grid; grid-template-columns: minmax(0,5fr) minmax(0,6fr); gap: 56px; align-items: center;\">\n          <div>\n            <div style=\"color: #A0A0A0; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 16px;\">Fields<\u002Fdiv>\n            <h3 style=\"margin: 0; color: #F4F4F4; font-size: 34px; font-weight: 700; line-height: 1.18; letter-spacing: -0.025em;\">Twelve field types. One generator.<\u002Fh3>\n            <p style=\"margin: 16px 0 0; color: #A0A0A0; font-size: 16px; line-height: 1.65;\">Every field is a function. It declares its admin input, its Convex column, its TypeScript type, and its Zod validator at once, so the four can never drift apart.<\u002Fp>\n            <div style=\"display: flex; flex-direction: column; gap: 14px; margin-top: 28px;\">\n              <div style=\"display: flex; gap: 12px; align-items: flex-start;\">\n                <span style=\"color: #F07040; font-size: 13px; line-height: 1.6; width: 16px; flex: none;\">▤<\u002Fspan>\n                <span style=\"color: #F4F4F4; font-size: 15px; line-height: 1.6;\">array and group nest arbitrarily<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 12px; align-items: flex-start;\">\n                <span style=\"color: #F07040; font-size: 13px; line-height: 1.6; width: 16px; flex: none;\">▦<\u002Fspan>\n                <span style=\"color: #F4F4F4; font-size: 15px; line-height: 1.6;\">a blocks field generates a typed union<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 12px; align-items: flex-start;\">\n                <span style=\"color: #F07040; font-size: 13px; line-height: 1.6; width: 16px; flex: none;\">◐<\u002Fspan>\n                <span style=\"color: #F4F4F4; font-size: 15px; line-height: 1.6;\">color stores oklch and feeds the theme system<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border: 1px solid #2A2A2A; border-radius: 4px; overflow: hidden; min-width: 0;\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 14px; border-bottom: 1px solid #2A2A2A; background: #141414;\">\n              <span style=\"color: #717171; font-family: 'Geist Mono', monospace; font-size: 12px;\">src/vexcms/collections/posts.ts<\u002Fspan>\n              <span style=\"color: #717171; font-family: 'Geist Mono', monospace; font-size: 11px; border: 1px solid #2A2A2A; border-radius: 2px; padding: 2px 6px;\">ts<\u002Fspan>\n            <\u002Fdiv>\n            <pre style=\"margin: 0; padding: 18px 16px; font-family: 'Geist Mono', monospace; font-size: 12.5px; line-height: 1.7; color: #C7C7C7; background: #111111; overflow-x: auto;\"><span style=\"color: #F07040;\">export const<\u002Fspan> posts = <span style=\"color: #F4F4F4;\">defineCollection<\u002Fspan>({\n  slug: <span style=\"color: #A0A0A0;\">\"posts\"<\u002Fspan>,\n  fields: {\n    title: <span style=\"color: #F4F4F4;\">text<\u002Fspan>({ required: <span style=\"color: #F07040;\">true<\u002Fspan> }),\n    author: <span style=\"color: #F4F4F4;\">relationship<\u002Fspan>({ to: <span style=\"color: #A0A0A0;\">\"users\"<\u002Fspan> }),\n    theme: <span style=\"color: #F4F4F4;\">color<\u002Fspan>({ label: <span style=\"color: #A0A0A0;\">\"Accent\"<\u002Fspan> }),\n    sections: <span style=\"color: #F4F4F4;\">blocks<\u002Fspan>({ blocks: [hero, features] }),\n  },\n})<\u002Fpre>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top: 1px solid #2A2A2A; padding: 32px 40px 40px;\">\n        <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171; margin-bottom: 18px;\">media \"none\" — the graceful fallback<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 7fr 5fr; gap: 56px;\">\n          <div>\n            <div style=\"color: #A0A0A0; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 16px;\">Beyond content<\u002Fdiv>\n            <h3 style=\"margin: 0; color: #F4F4F4; font-size: 34px; font-weight: 700; line-height: 1.18; letter-spacing: -0.025em;\">Globals, themes, and blocks are collections too.<\u002Fh3>\n            <p style=\"margin: 16px 0 0; color: #A0A0A0; font-size: 16px; line-height: 1.65;\">Nothing in Vex is a special case bolted onto the side. Site settings, the theme record, and the page-builder blocks are all declared with the same helpers.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 0; border-left: 1px solid #2A2A2A; padding-left: 28px;\">\n            <div style=\"display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #2A2A2A;\"><span style=\"color: #F07040; font-size: 13px; width: 16px; flex: none;\">▤<\u002Fspan><span style=\"color: #F4F4F4; font-size: 15px; line-height: 1.6;\">singletons<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #2A2A2A;\"><span style=\"color: #F07040; font-size: 13px; width: 16px; flex: none;\">◐<\u002Fspan><span style=\"color: #F4F4F4; font-size: 15px; line-height: 1.6;\">32 tokens × light and dark<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 12px; padding: 12px 0;\"><span style=\"color: #F07040; font-size: 13px; width: 16px; flex: none;\">⚡<\u002Fspan><span style=\"color: #F4F4F4; font-size: 15px; line-height: 1.6;\">applied server-side on first paint, live-updated when edited<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 168px 1fr; gap: 0 24px; font-size: 14px; line-height: 1.6;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Layout<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Standard padding, container. Desktop <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">grid xl:grid-cols-[5fr_6fr] gap-14 items-center<\u002Fspan> — the media column is the wider one, because a code pane needs 60–70 characters and the text column reads better at 46rem. Tablet: same two columns at <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">md:grid-cols-2 gap-10 items-start<\u002Fspan>. Mobile: single column, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">gap-8<\u002Fspan>, text always first regardless of <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">mediaPosition<\u002Fspan>. <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">mediaPosition: \"left\"<\u002Fspan> is <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">xl:grid-cols-[6fr_5fr]<\u002Fspan> with <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">order<\u002Fspan> classes on the two children — never a reversed source order, so the reading order stays text-first for assistive tech.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Text column<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Eyebrow (12px/500/+0.08em uppercase <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground<\u002Fspan>) → 16px → h2 (section scale, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">max-w-[20ch]<\u002Fspan> at <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">xl<\u002Fspan>) → 16px → <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">body<\u002Fspan> at 16px/1.65 <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground max-w-[46rem]<\u002Fspan> → 28px → bullets. Blank eyebrow: h2 starts the column, no reserved space.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Bullets<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">flex flex-col gap-3.5<\u002Fspan>; each row <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">flex gap-3 items-start<\u002Fspan> with a fixed 16px icon slot (<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Icon size-4 text-primary mt-[3px] shrink-0<\u002Fspan>) and 15px/1.6 <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-foreground<\u002Fspan> text. No <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">ul<\u002Fspan> markers — the icon is the marker; semantically it is still <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">ul<\u002Fspan>/<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">li<\u002Fspan> with <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">list-none<\u002Fspan>. Missing <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">icon<\u002Fspan>: the slot holds a 4px <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-primary rounded-4xl<\u002Fspan> dot instead, keeping the 16px indent so mixed arrays stay aligned. Icons used: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Layers<\u002Fspan> · <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Blocks<\u002Fspan> · <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Palette<\u002Fspan> · <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Lock<\u002Fspan> · <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">KeyRound<\u002Fspan> · <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Globe<\u002Fspan> · <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Boxes<\u002Fspan> · <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Zap<\u002Fspan> — all verified. 8+ bullets: the list becomes <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">md:grid-cols-2 gap-x-8<\u002Fspan> inside the text column. 0 bullets: body copy alone, no empty gap.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">media: code<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">The CodeShowcase pane, minus the uppercase label: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border border-border rounded-md<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">h-10<\u002Fspan> chrome bar carrying <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">codeFilename<\u002Fspan> + language chip + copy button, body on <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">--color-code-bg<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">max-h-[460px]<\u002Fspan> then scroll. Same shiki server pass. No filename: the bar keeps the chip and copy button right-aligned. This is the variant the seed uses and the only one a scaffolded project sees.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">media: image / none<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">image<\u002Fspan>: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">VexImage<\u002Fspan> in a <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">rounded-md border border-border overflow-hidden bg-card<\u002Fspan> frame, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">aspect-[4/3]<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">object-cover<\u002Fspan>, 1px inset border to keep light screenshots from bleeding into the surface. If <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">media: \"image\"<\u002Fspan> but <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">image<\u002Fspan> is empty — the fresh-scaffold case — the block falls through to <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">none<\u002Fspan>. Never a placeholder box, never a broken frame. <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">none<\u002Fspan>: the row becomes <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">xl:grid-cols-[7fr_5fr]<\u002Fspan> with bullets moving into the right column as a divided list (<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border-l border-border pl-7<\u002Fspan>, rows <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">py-3<\u002Fspan> separated by <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border-b border-border<\u002Fspan>, last row none) — see the second specimen. With no media and no bullets the block collapses to a single 46rem prose column, left-aligned, which is a legitimate quiet section rather than a hole.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Stacking<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Consecutive Splits alternate <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">mediaPosition<\u002Fspan> by field value, not by an <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">:nth-child<\u002Fspan> rule — the editor must be able to break the alternation. Each keeps full padding, so two Splits are separated by 224px of whitespace at desktop and no divider. On <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">/features<\u002Fspan> the three Splits run right / left / right.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"howitworks\" style=\"margin-bottom: 96px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">10 — HowItWorks<\u002Fdiv>\n    <h2 style=\"margin: 0 0 28px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">A numbered rail, not a timeline graphic.<\u002Fh2>\n\n    <div style=\"background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 4px; overflow: hidden; margin-bottom: 24px;\">\n      <div style=\"display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid #2A2A2A; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\"><span>Specimen · 4 steps<\u002Fspan><span>desktop: 4-col rail<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 56px 40px;\">\n        <div style=\"max-width: 36rem; margin-bottom: 40px;\">\n          <h3 style=\"margin: 0; color: #F4F4F4; font-size: 34px; font-weight: 700; line-height: 1.18; letter-spacing: -0.025em;\">From empty directory to live content.<\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; border-top: 1px solid #2A2A2A; padding-top: 24px;\">\n          <div>\n            <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 16px;\">\n              <span style=\"color: #F07040; font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 500;\">01<\u002Fspan>\n              <span style=\"flex: 1; height: 1px; background: #2A2A2A;\"><\u002Fspan>\n              <span style=\"color: #A0A0A0; font-size: 13px;\">▸<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"color: #F4F4F4; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;\">Scaffold your project<\u002Fdiv>\n            <p style=\"margin: 8px 0 0; color: #A0A0A0; font-size: 14px; line-height: 1.6;\">pnpm create vexcms@latest gives you a Next.js app with Convex, Better Auth, and the admin panel already wired<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 16px;\">\n              <span style=\"color: #F07040; font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 500;\">02<\u002Fspan>\n              <span style=\"flex: 1; height: 1px; background: #2A2A2A;\"><\u002Fspan>\n              <span style=\"color: #A0A0A0; font-size: 13px;\">‹›<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"color: #F4F4F4; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;\">Define your schema<\u002Fdiv>\n            <p style=\"margin: 8px 0 0; color: #A0A0A0; font-size: 14px; line-height: 1.6;\">Declare collections with <span>define<\u002Fspan><span>Collection<\u002Fspan>() and the field helpers. vex dev watches and regenerates your Convex schema, types, and validators<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 16px;\">\n              <span style=\"color: #F07040; font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 500;\">03<\u002Fspan>\n              <span style=\"flex: 1; height: 1px; background: #2A2A2A;\"><\u002Fspan>\n              <span style=\"color: #A0A0A0; font-size: 13px;\">▦<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"color: #F4F4F4; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;\">Build with blocks<\u002Fdiv>\n            <p style=\"margin: 8px 0 0; color: #A0A0A0; font-size: 14px; line-height: 1.6;\">Compose pages from typed content blocks. Each block is a config plus a renderer, edited from the admin panel<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 16px;\">\n              <span style=\"color: #F07040; font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 500;\">04<\u002Fspan>\n              <span style=\"flex: 1; height: 1px; background: #2A2A2A;\"><\u002Fspan>\n              <span style=\"color: #A0A0A0; font-size: 13px;\">↗<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"color: #F4F4F4; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;\">Deploy and go live<\u002Fdiv>\n            <p style=\"margin: 8px 0 0; color: #A0A0A0; font-size: 14px; line-height: 1.6;\">Push to Convex, deploy the Next.js app. Content changes propagate to every subscriber with no cache invalidation<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 168px 1fr; gap: 0 24px; font-size: 14px; line-height: 1.6;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Layout<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Standard padding, container, left section header. Desktop: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">grid xl:grid-cols-4 gap-8<\u002Fspan> on a <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border-t border-border pt-6<\u002Fspan> rail. Tablet <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">md:grid-cols-2 gap-x-8 gap-y-10<\u002Fspan>. Mobile: vertical list, each step <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border-t border-border pt-4<\u002Fspan> with <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">gap-8<\u002Fspan> — the rule sits above each step, which is the mobile equivalent of the horizontal rail. Origin UI's timeline supplies the connector idea; its <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">radix-ui<\u002Fspan> <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Slot.Root<\u002Fspan> is removed (concrete elements, no polymorphism) and its dot-and-line SVG is replaced by border utilities, which cost nothing and theme correctly.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Step head<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">flex items-center gap-2.5<\u002Fspan>: index in mono 12px/500 <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-primary<\u002Fspan>, zero-padded and generated by the renderer (not a field); a <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">flex-1 h-px bg-border<\u002Fspan> connector; then the step's <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Icon size-4 text-muted-foreground<\u002Fspan>. The connector is what makes four cards read as a sequence, and it is the reason the icon sits right rather than left. Last step's connector is retained — it points at the CTA that follows.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Type &amp; icons<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Title 17px/600 <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-foreground<\u002Fspan>, 16px under the head. Description 14px/1.6 <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground<\u002Fspan>, 8px under the title. Icons: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Terminal<\u002Fspan> · <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Code<\u002Fspan> · <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">LayoutGrid<\u002Fspan> · <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Rocket<\u002Fspan> (note: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Code2<\u002Fspan> does not exist). Blank icon: the connector runs to the full cell width; nothing else moves.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Empty &amp; overflow<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">1 step: one cell at <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">max-w-[46rem]<\u002Fspan>, index <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">01<\u002Fspan>, no connector. 5–8 steps: grid wraps; indices keep counting; row 2 gets its own <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border-t<\u002Fspan>. 12 steps: switch to <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">xl:grid-cols-3<\u002Fspan> above 8 items so descriptions keep a 40-character measure. Blank descriptions: titles alone, cells stay top-aligned, rail unaffected. No entrance animation — this section is usually below the fold.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"faq\" style=\"margin-bottom: 96px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">11 — FAQ<\u002Fdiv>\n    <h2 style=\"margin: 0 0 28px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">Question left, answer under it.<\u002Fh2>\n\n    <div style=\"background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 4px; overflow: hidden; margin-bottom: 24px;\">\n      <div style=\"display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid #2A2A2A; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\"><span>Specimen · 6 items, first open<\u002Fspan><span>2-col: header / accordion<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 56px 40px;\">\n        <div style=\"display: grid; grid-template-columns: 4fr 7fr; gap: 56px;\">\n          <div>\n            <h3 style=\"margin: 0; color: #F4F4F4; font-size: 34px; font-weight: 700; line-height: 1.18; letter-spacing: -0.025em;\">Questions we keep getting.<\u002Fh3>\n            <p style=\"margin: 16px 0 0; color: #A0A0A0; font-size: 16px; line-height: 1.65;\">Anything missing? Open an issue on GitHub — that is the fastest way to get an answer.<\u002Fp>\n            <div style=\"display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; color: #F07040; font-size: 15px; font-weight: 500;\">Open an issue<span>→<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid #2A2A2A;\">\n            <div style=\"border-bottom: 1px solid #2A2A2A; padding: 18px 0;\">\n              <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;\">\n                <span style=\"color: #F4F4F4; font-size: 16px; font-weight: 500; line-height: 1.5;\">What is VexCMS?<\u002Fspan>\n                <span style=\"color: #F07040; font-size: 14px; line-height: 1.6;\">−<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin: 12px 0 0; color: #A0A0A0; font-size: 15px; line-height: 1.65; max-width: 68ch;\">A headless CMS built natively on Convex. You declare collections in TypeScript; Vex generates the Convex schema, the types, the validators, and the admin forms from that one declaration.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"border-bottom: 1px solid #2A2A2A; padding: 18px 0;\">\n              <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;\">\n                <span style=\"color: #F4F4F4; font-size: 16px; font-weight: 500; line-height: 1.5;\">How is this different from other headless CMS platforms?<\u002Fspan>\n                <span style=\"color: #A0A0A0; font-size: 14px; line-height: 1.6;\">+<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-bottom: 1px solid #2A2A2A; padding: 18px 0;\">\n              <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;\">\n                <span style=\"color: #F4F4F4; font-size: 16px; font-weight: 500; line-height: 1.5;\">Do I need to know Convex?<\u002Fspan>\n                <span style=\"color: #A0A0A0; font-size: 14px; line-height: 1.6;\">+<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-bottom: 1px solid #2A2A2A; padding: 18px 0;\">\n              <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;\">\n                <span style=\"color: #F4F4F4; font-size: 16px; font-weight: 500; line-height: 1.5;\">Is it production ready?<\u002Fspan>\n                <span style=\"color: #A0A0A0; font-size: 14px; line-height: 1.6;\">+<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-bottom: 1px solid #2A2A2A; padding: 18px 0;\">\n              <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;\">\n                <span style=\"color: #F4F4F4; font-size: 16px; font-weight: 500; line-height: 1.5;\">Which frameworks does it support?<\u002Fspan>\n                <span style=\"color: #A0A0A0; font-size: 14px; line-height: 1.6;\">+<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding: 18px 0;\">\n              <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;\">\n                <span style=\"color: #F4F4F4; font-size: 16px; font-weight: 500; line-height: 1.5;\">What does it cost?<\u002Fspan>\n                <span style=\"color: #A0A0A0; font-size: 14px; line-height: 1.6;\">+<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 168px 1fr; gap: 0 24px; font-size: 14px; line-height: 1.6;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Layout<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Standard padding, container. Desktop <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">grid xl:grid-cols-[4fr_7fr] gap-14 items-start<\u002Fspan> — header column sticky-free, left; accordion right. Tablet and mobile: single column, header above, 32px gap. The header column is the one exception to \"FAQ is centred\" — a 2-column FAQ puts six answers in a 68ch measure instead of a 90ch one, and it fills the left third that would otherwise be white space.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Items<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Accordion<\u002Fspan> from <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">@vexcms/react<\u002Fspan> (Base UI), single-open, first item open by default, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">collapsible<\u002Fspan>. Items are rules, not cards: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border-t border-border<\u002Fspan> on the list, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border-b border-border<\u002Fspan> per item, no radius, no background. Trigger: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">flex w-full items-start justify-between gap-6 py-[18px] text-left<\u002Fspan>, question 16px/500 <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-foreground<\u002Fspan>, indicator <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Plus<\u002Fspan>→<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Minus<\u002Fspan> at <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">size-4<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground<\u002Fspan> at rest and <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-primary<\u002Fspan> when open (no rotation — a swapped glyph beats a spun chevron at this radius). Answer: 15px/1.65 <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground max-w-[68ch] pb-[18px] pt-3<\u002Fspan>, indented to the question, not to the indicator.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">States<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Trigger hover: question stays <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-foreground<\u002Fspan>, indicator goes <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-foreground<\u002Fspan>; no background fill (a full-width hover band at 6 items reads as noise). Focus-visible: standard ring, inset by 2px so it does not sit on the rules. Open/close via <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">tw-animate-css<\u002Fspan> height + opacity, 200ms, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">--ease-emphasized<\u002Fspan>; disabled under reduced motion, where the panel simply appears. Whole row is the hit target, minimum 52px tall.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Support link<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Rendered in the header column, 20px below the subheading: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Button variant=\"link\"<\u002Fspan>, 15px/500 <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-primary<\u002Fspan>, trailing <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">ArrowRight size-4<\u002Fspan>, underline on hover only. Label is fixed copy in the renderer (\"Open an issue\") because the field stores only the href. Blank <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">supportLink<\u002Fspan>: link and its gap disappear.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Overflow<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">1 item: two rules and one row — acceptable. 12 items: the list keeps going; no pagination, no search, no \"see all\". A question that wraps to three lines pushes the indicator to stay top-aligned (<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">items-start<\u002Fspan>), never centred against the block. Long answers are unstyled prose — no rich text, so no lists inside an answer; if an answer needs a list, it becomes several FAQ items.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"cta\" style=\"margin-bottom: 96px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">12 — CTA<\u002Fdiv>\n    <h2 style=\"margin: 0 0 28px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">The page's last surface.<\u002Fh2>\n\n    <div style=\"background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 4px; overflow: hidden; margin-bottom: 24px;\">\n      <div style=\"display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid #2A2A2A; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\"><span>Specimen · 2 actions<\u002Fspan><span>bg-card · border-y · centred<\u002Fspan><\u002Fdiv>\n      <div style=\"background: #141414; border-top: 1px solid #2A2A2A; border-bottom: 1px solid #2A2A2A; padding: 88px 40px; text-align: center;\">\n        <h3 style=\"margin: 0 auto; color: #F4F4F4; font-size: 40px; font-weight: 700; line-height: 1.12; letter-spacing: -0.03em; max-width: 24ch;\">Start with a schema. Ship in an hour.<\u002Fh3>\n        <p style=\"margin: 20px auto 0; color: #A0A0A0; font-size: 17px; line-height: 1.6; max-width: 60ch;\">Scaffold a Next.js + Convex project with authentication, the admin panel, and this marketing site already seeded.<\u002Fp>\n        <div style=\"display: flex; gap: 12px; justify-content: center; margin-top: 36px;\">\n          <span style=\"background: #F07040; color: #0A0A0A; font-size: 15px; font-weight: 600; padding: 11px 20px; border-radius: 2px;\">Read the docs<\u002Fspan>\n          <span style=\"border: 1px solid #2A2A2A; color: #F4F4F4; font-size: 15px; font-weight: 500; padding: 11px 20px; border-radius: 2px;\">View on GitHub<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 168px 1fr; gap: 0 24px; font-size: 14px; line-height: 1.6;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Layout<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Full-bleed <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-card border-y border-border<\u002Fspan>, container inside, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-center<\u002Fspan>. Padding <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">py-16 md:py-24 xl:py-32<\u002Fspan> — the largest on the site; it is the only block permitted more air than a standard section, and it is what separates the page from the footer. Heading at h1-interior scale (<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-[28px] md:text-4xl xl:text-[40px]<\u002Fspan>), <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">max-w-[24ch] mx-auto<\u002Fspan>; subheading 17px <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground max-w-[60ch] mx-auto<\u002Fspan>, 20px below; actions 36px below.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Actions<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">actions<\u002Fspan> has no <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">variant<\u002Fspan> field, so the renderer assigns by index: first is <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">default<\u002Fspan>, every subsequent one is <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">outline<\u002Fspan>. <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">size=\"lg\"<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">flex flex-wrap justify-center gap-3<\u002Fspan>. Below 640: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">flex-col w-full max-w-[320px] mx-auto<\u002Fspan>. 1 action: single centred button. 0 actions: the block still renders as a closing statement — heading and subheading only, which is why the CTA carries no border-radius panel that would look empty. 4+ actions wrap to a second row at the same gap; do not shrink to <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">size=\"sm\"<\u002Fspan>.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Adjacency<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Because CTA and Stats share <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-card<\u002Fspan>, they must never be adjacent — the seed never does it, and if an editor makes it happen the shared <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border-y<\u002Fs
