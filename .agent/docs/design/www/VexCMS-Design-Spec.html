document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

olygon(0 0, 100% 0, 50% 100%);\"><\u002Fdiv>\n      <span style=\"font-size: 15px; font-weight: 800; letter-spacing: -0.03em;\">VexCMS<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #717171; margin-bottom: 24px;\">Design specification · marketing site · v1<\u002Fdiv>\n    <h1 style=\"margin: 0; font-size: 64px; font-weight: 800; line-height: 1.02; letter-spacing: -0.04em; max-width: 20ch;\">Stark × Ember, specified.<\u002Fh1>\n    <p style=\"margin: 28px 0 0; font-size: 19px; line-height: 1.6; color: #2E2E2E; max-width: 62ch; text-wrap: pretty;\">Every page, every block, every token for the VexCMS marketing site — which is also the default <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.875em; background: #FEF0E8; color: #C04E1E; padding: 1px 6px; border-radius: 1px;\">pnpm create vexcms<\u002Fspan> template. Tailwind v4 + Base UI, semantic tokens only, no motion library, no media required.<\u002Fp>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 36px;\">\n      <span style=\"font-family: 'Geist Mono', monospace; font-size: 12px; padding: 5px 10px; border: 1px solid #E4E4E4; background: #FFFFFF; border-radius: 2px; color: #2E2E2E;\">3 pages<\u002Fspan>\n      <span style=\"font-family: 'Geist Mono', monospace; font-size: 12px; padding: 5px 10px; border: 1px solid #E4E4E4; background: #FFFFFF; border-radius: 2px; color: #2E2E2E;\">11 blocks<\u002Fspan>\n      <span style=\"font-family: 'Geist Mono', monospace; font-size: 12px; padding: 5px 10px; border: 1px solid #E4E4E4; background: #FFFFFF; border-radius: 2px; color: #2E2E2E;\">12 field types<\u002Fspan>\n      <span style=\"font-family: 'Geist Mono', monospace; font-size: 12px; padding: 5px 10px; border: 1px solid #E4E4E4; background: #FFFFFF; border-radius: 2px; color: #2E2E2E;\">32 tokens × 2<\u002Fspan>\n      <span style=\"font-family: 'Geist Mono', monospace; font-size: 12px; padding: 5px 10px; border: 1px solid #E4E4E4; background: #FFFFFF; border-radius: 2px; color: #2E2E2E;\">0 media assets<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <nav style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0 32px; padding: 32px 0 0; border-bottom: 1px solid #E4E4E4; margin-bottom: 88px;\">\n    <div style=\"padding-bottom: 28px;\">\n      <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #A0A0A0; margin-bottom: 12px;\">A · Foundations<\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 6px; font-size: 14px;\">\n        <a href=\"#reading\">How to read this<\u002Fa>\n        <a href=\"#tokens\">Layout &amp; rhythm<\u002Fa>\n        <a href=\"#type\">Type &amp; radius<\u002Fa>\n        <a href=\"#motion\">Motion kit<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding-bottom: 28px;\">\n      <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #A0A0A0; margin-bottom: 12px;\">B · Blocks<\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 6px; font-size: 14px;\">\n        <a href=\"#header\">Header &amp; Footer<\u002Fa>\n        <a href=\"#hero\">Hero — full / compact<\u002Fa>\n        <a href=\"#stats\">Stats<\u002Fa>\n        <a href=\"#features\">Features<\u002Fa>\n        <a href=\"#codeshowcase\">CodeShowcase<\u002Fa>\n        <a href=\"#split\">Split<\u002Fa>\n        <a href=\"#howitworks\">HowItWorks<\u002Fa>\n        <a href=\"#faq\">FAQ<\u002Fa>\n        <a href=\"#cta\">CTA<\u002Fa>\n        <a href=\"#roadmap\">Roadmap<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding-bottom: 28px;\">\n      <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #A0A0A0; margin-bottom: 12px;\">C · Pages<\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 6px; font-size: 14px;\">\n        <a href=\"#page-home\">/<\u002Fa>\n        <a href=\"#page-features\">/features<\u002Fa>\n        <a href=\"#page-roadmap\">/roadmap<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding-bottom: 28px;\">\n      <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #A0A0A0; margin-bottom: 12px;\">D · Handoff<\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 6px; font-size: 14px;\">\n        <a href=\"#theme\">Theme document<\u002Fa>\n        <a href=\"#extra\">Extra @theme tokens<\u002Fa>\n        <a href=\"#order\">Build order<\u002Fa>\n        <a href=\"#deviations\">Deviations<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <section id=\"reading\" style=\"margin-bottom: 96px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">00 — How to read this<\u002Fdiv>\n    <h2 style=\"margin: 0 0 24px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">Three rules that resolve every ambiguity.<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;\">\n      <div style=\"background: #FFFFFF; border: 1px solid #E4E4E4; border-radius: 4px; padding: 24px; box-shadow: 0 1px 2px rgba(10,10,10,0.04);\">\n        <div style=\"font-size: 15px; font-weight: 600; margin-bottom: 8px;\">Tokens decide colour<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #2E2E2E;\">If a surface, text, or border colour is named in this document it is a semantic token. Any hex you see here is <em>documentation of the theme document's values<\u002Fem>, never something to type into a component. Code-pane colours are the one exception and live in <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.875em;\">@theme<\u002Fspan>, not in the theme record.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid #E4E4E4; border-radius: 4px; padding: 24px; box-shadow: 0 1px 2px rgba(10,10,10,0.04);\">\n        <div style=\"font-size: 15px; font-weight: 600; margin-bottom: 8px;\">Fields decide content<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #2E2E2E;\">Every element below maps to a field on its block. Nothing is hand-authored per page. Where a design wants a list, it is an <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.875em;\">array(group{…})<\u002Fspan>; where it wants emphasis inside prose, it does without — there is no rich text.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid #E4E4E4; border-radius: 4px; padding: 24px; box-shadow: 0 1px 2px rgba(10,10,10,0.04);\">\n        <div style=\"font-size: 15px; font-weight: 600; margin-bottom: 8px;\">Every block stands alone<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #2E2E2E;\">Each block owns its own vertical padding and its own container. Two of any block stacked in any order must read correctly, on a page this document never describes. Section B is therefore normative; section C is only a seed order.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top: 20px; background: #FFFFFF; border: 1px solid #E4E4E4; border-left: 2px solid #E8622A; border-radius: 4px; padding: 20px 24px;\">\n      <p style=\"margin: 0; font-size: 14px; line-height: 1.65; color: #2E2E2E;\"><strong style=\"font-weight: 600;\">Specimens in this document render dark.<\u002Fstrong> The marketing site is dark by default (a light theme is one admin edit away and every specimen below is token-only, so it survives the swap). Specimens are drawn at desktop proportions; the spec rows beneath each one carry the mobile and tablet values.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"tokens\" style=\"margin-bottom: 96px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">01 — Layout &amp; vertical rhythm<\u002Fdiv>\n    <h2 style=\"margin: 0 0 28px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">One container, one rhythm, three breakpoints.<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: 200px 1fr; gap: 0 24px; font-size: 14px; line-height: 1.6;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Breakpoints<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Mobile &lt; 640 · tablet 768–1024 (<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">md<\u002Fspan>/<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">lg<\u002Fspan>) · desktop ≥ 1280 (<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">xl<\u002Fspan>). Nothing changes above <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">xl<\u002Fspan> except centring.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Container<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">mx-auto w-full max-w-[1280px] px-5 md:px-8 xl:px-10<\u002Fspan> — 20 / 32 / 40px gutters. Prose-only sections nest a second measure: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">max-w-[46rem]<\u002Fspan> (736px), never wider, so body copy stays at 62–72 characters.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Section padding<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Standard block: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">py-14 md:py-20 xl:py-28<\u002Fspan> (56 / 80 / 112px). Quiet blocks (Stats, compact Hero): <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">py-10 md:py-14 xl:py-16<\u002Fspan>. CTA is the only block that gets <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">py-16 md:py-24 xl:py-32<\u002Fspan>. Adjacent blocks never collapse padding — the double gap is intentional and is what makes 80px of whitespace read as structure.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Section seams<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">No block paints its own background except Stats and CTA (<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-card<\u002Fspan>, full-bleed, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border-y border-border<\u002Fspan>). Everything else sits on <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-background<\u002Fspan>. Max two surfaces visible per scroll — that is the \"1–2 background colours\" rule.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Grid &amp; gaps<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Card grids: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">gap-4 md:gap-5 xl:gap-6<\u002Fspan> (16 / 20 / 24px). Text-to-element stacks use a 4px scale: 8 / 12 / 16 / 24 / 40. Heading-to-subheading is always 16px; subheading-to-content is always 40px on desktop, 28px below <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">md<\u002Fspan>.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Section header<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">One pattern, every block that has <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">heading<\u002Fspan> + <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">subheading<\u002Fspan>: left-aligned, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">max-w-[36rem]<\u002Fspan>, h2 then subheading in <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground<\u002Fspan>, 40px above the content. Centred section headers are used <em>only<\u002Fem> in FAQ and CTA. When <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">subheading<\u002Fspan> is blank the gap drops from 40px to 32px — the h2 does not grow to compensate.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"type\" style=\"margin-bottom: 96px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">02 — Type scale &amp; radius<\u002Fdiv>\n    <h2 style=\"margin: 0 0 28px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">Geist only. Weight does the work.<\u002Fh2>\n    <div style=\"background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 4px; padding: 40px; margin-bottom: 24px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 28px;\">\n        <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px;\">\n          <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\">display · h1 hero · 40 / 56 / 72px · 800 · 1.02 · -0.04em<\u002Fdiv>\n          <div style=\"color: #F4F4F4; font-size: 60px; font-weight: 800; line-height: 1.02; letter-spacing: -0.04em;\">The CMS that thinks in types.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px;\">\n          <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\">h1 interior · 32 / 40 / 48px · 700 · 1.12 · -0.03em<\u002Fdiv>\n          <div style=\"color: #F4F4F4; font-size: 44px; font-weight: 700; line-height: 1.12; letter-spacing: -0.03em;\">Everything comes from one schema.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px;\">\n          <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\">h2 section · 26 / 30 / 36px · 700 · 1.18 · -0.025em<\u002Fdiv>\n          <div style=\"color: #F4F4F4; font-size: 34px; font-weight: 700; line-height: 1.18; letter-spacing: -0.025em;\">Write the config. Get the types.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px;\">\n          <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\">h3 card title · 17 / 17 / 18px · 600 · 1.35 · -0.01em<\u002Fdiv>\n          <div style=\"color: #F4F4F4; font-size: 18px; font-weight: 600; line-height: 1.35; letter-spacing: -0.01em;\">Convex-native codegen<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px;\">\n          <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\">lead · 17 / 18 / 19px · 400 · 1.6 · muted-foreground · 62–72ch<\u002Fdiv>\n          <div style=\"color: #A0A0A0; font-size: 19px; font-weight: 400; line-height: 1.6; max-width: 62ch;\">A headless CMS built natively on Convex. Declare your collections in TypeScript and Vex generates the Convex schema, the types, and the queries — no translation layer.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px;\">\n          <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\">body · 15 / 15 / 15px · 400 · 1.65 · muted-foreground · 64ch max<\u002Fdiv>\n          <div style=\"color: #A0A0A0; font-size: 15px; font-weight: 400; line-height: 1.65; max-width: 64ch;\">Fields, relationships, and query return types are checked from the database to the component. Rename a field and the compiler names every call site.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px;\">\n          <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\">eyebrow / label · 12px · 500 · +0.08em · uppercase · muted-foreground<\u002Fdiv>\n          <div style=\"color: #A0A0A0; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;\">Access control<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px;\">\n          <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\">mono · code 13 / 13.5px · 1.7 · filenames &amp; chips 12px<\u002Fdiv>\n          <div style=\"font-family: 'Geist Mono', monospace; color: #F4F4F4; font-size: 13.5px; line-height: 1.7;\">export const <span>features<\u002Fspan><span>Block<\u002Fspan> = <span>define<\u002Fspan><span>Block<\u002Fspan>({ slug: \"features\" })<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 200px 1fr; gap: 0 24px; font-size: 14px; line-height: 1.6;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Tailwind map<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">display <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-[40px] md:text-[56px] xl:text-[72px] font-extrabold leading-[1.02] tracking-[-0.04em]<\u002Fspan> · h1 <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-[32px] md:text-4xl xl:text-5xl font-bold tracking-[-0.03em]<\u002Fspan> · h2 <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-[26px] md:text-3xl xl:text-4xl font-bold tracking-[-0.025em]<\u002Fspan> · h3 <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-[17px] xl:text-lg font-semibold<\u002Fspan> · lead <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-[17px] md:text-lg xl:text-[19px] leading-[1.6]<\u002Fspan> · body <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-[15px] leading-[1.65]<\u002Fspan> · label <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-xs font-medium uppercase tracking-[0.08em]<\u002Fspan>.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Casing<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Sentence case everywhere, headlines end in a period. Uppercase is reserved for the 12px tracked label. Numerals in Stats and tables use <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">tabular-nums<\u002Fspan>.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Radius usage<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">--radius: 4px<\u002Fspan>. Buttons, inputs, chips, code-pane chrome buttons → <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">rounded-sm<\u002Fspan> (2px). Cards, code panes, accordion items, media frames → <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">rounded-md<\u002Fspan> (4px). Sheet / dialog / mobile menu → <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">rounded-lg<\u002Fspan> (8px). Badges, status pills, avatars → <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">rounded-4xl<\u002Fspan>. Nothing on the site uses <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">xl<\u002Fspan>–<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">3xl<\u002Fspan>; a theme that raises <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">--radius<\u002Fspan> to 12px must still leave pills as pills.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Borders &amp; shadow<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border border-border<\u002Fspan>, 1px, always. Light mode adds <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">shadow-xs<\u002Fspan> to cards and <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">shadow-md<\u002Fspan> to popovers/sheets; dark mode has no box-shadow at all (<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">dark:shadow-none<\u002Fspan>) and separates surfaces by background value only. No coloured borders except <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">ring-ring<\u002Fspan> focus and destructive inputs.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"motion\" style=\"margin-bottom: 96px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">03 — Motion<\u002Fdiv>\n    <h2 style=\"margin: 0 0 16px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">Two keyframes, one easing, one blessed loop.<\u002Fh2>\n    <p style=\"margin: 0 0 32px; font-size: 15px; line-height: 1.65; color: #2E2E2E; max-width: 64ch; text-wrap: pretty;\">Everything below uses the shipped <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.875em;\">AnimatedGroup<\u002Fspan> / <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.875em;\">AnimatedItem<\u002Fspan> / <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.875em;\">TextEffect<\u002Fspan> kit. No section adds a new keyframe except the two declared here, and no element animates on scroll — entrances fire on mount, which keeps every block a server component.<\u002Fp>\n    <div style=\"background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 4px; padding: 28px; overflow-x: auto; margin-bottom: 24px;\">\n      <pre style=\"margin: 0; font-family: 'Geist Mono', monospace; font-size: 13px; line-height: 1.7; color: #E8E8E8;\">/* globals.css — the only additions to the shipped kit */\n\n@keyframes livepulse {          /* the one decorative loop: In-progress dot */\n  0%, 100% { opacity: 1; }\n  50%      { opacity: 0.35; }\n}\n\n.live-dot { animation: livepulse 2s var(--ease-emphasized) infinite; }\n\n/* stagger contract — set on the group, read by each item */\n.reveal-group &gt; * { --reveal-delay: calc(var(--reveal-stagger, 60ms) * var(--i, 0)); }\n\n@media (prefers-reduced-motion: reduce) {\n  .item, .live-dot, .reveal-group &gt; * { animation: none !important; }\n  /* reduced motion is a full stop, not a shortened duration:\n     final state is painted immediately, opacity 1, no blur, no translate */\n}<\u002Fpre>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 200px 1fr; gap: 0 24px; font-size: 14px; line-height: 1.6;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Entrance budget<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Above the fold only. Hero (full) animates: badge <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">0ms<\u002Fspan> → h1 by word <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">80ms + 40ms/word<\u002Fspan> → subheading <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">280ms<\u002Fspan> → CTA row <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">380ms<\u002Fspan> → install row <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">460ms<\u002Fspan>. Hero (compact) animates h1 and subheading only, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">0 / 100ms<\u002Fspan>, no word split. Every other block on the page renders static — a page whose sixth section fades in on mount is a page that flashes on refresh.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Interaction<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">transition-colors duration-[180ms] ease-[var(--ease-emphasized)]<\u002Fspan> on every interactive surface. Background and border colour and opacity only — never width, never scale, never a shadow change. Active state is <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">translate-y-px<\u002Fspan>. Accordion and mobile sheet use <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">tw-animate-css<\u002Fspan> height/opacity utilities at 200ms.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Focus-visible<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Global: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">outline-2 outline-offset-2 outline-ring<\u002Fspan> plus <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">ring-[3px] ring-ring/28<\u002Fspan> on filled controls. Never removed, never restyled per block, and it must be visible against both <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-background<\u002Fspan> and the code-pane surface.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"border-top: 1px solid #0A0A0A; padding-top: 40px; margin-bottom: 64px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #A0A0A0;\">Part B<\u002Fdiv>\n    <h2 style=\"margin: 12px 0 0; font-size: 44px; font-weight: 800; line-height: 1.05; letter-spacing: -0.035em;\">Every block, in isolation.<\u002Fh2>\n    <p style=\"margin: 20px 0 0; font-size: 17px; line-height: 1.6; color: #2E2E2E; max-width: 62ch; text-wrap: pretty;\">Each entry is normative on its own. Specimens render dark at desktop proportions; the rows carry mobile and tablet.<\u002Fp>\n  <\u002Fdiv>\n\n  <section id=\"header\" style=\"margin-bottom: 96px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">04 — Header · site chrome<\u002Fdiv>\n    <h2 style=\"margin: 0 0 28px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">A rule that appears when you scroll.<\u002Fh2>\n\n    <div style=\"background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 4px; overflow: hidden; margin-bottom: 12px;\">\n      <div style=\"display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid #2A2A2A; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\"><span>Specimen · scroll-top state<\u002Fspan><span>h-16 · transparent<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 0 28px; height: 64px; display: flex; align-items: center; justify-content: space-between;\">\n        <div style=\"display: flex; align-items: center; gap: 40px;\">\n          <div style=\"display: flex; align-items: center; gap: 8px;\">\n            <div style=\"width: 16px; height: 16px; background: #F07040; clip-path: polygon(0 0, 100% 0, 50% 100%);\"><\u002Fdiv>\n            <span style=\"color: #F4F4F4; font-size: 15px; font-weight: 800; letter-spacing: -0.03em;\">VexCMS<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 4px;\">\n            <span style=\"color: #A0A0A0; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 2px;\">Features<\u002Fspan>\n            <span style=\"color: #A0A0A0; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 2px;\">Roadmap<\u002Fspan>\n            <span style=\"color: #A0A0A0; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 2px;\">Docs<\u002Fspan>\n            <span style=\"color: #F4F4F4; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 2px; background: rgba(240,112,64,0.12);\">Admin demo<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 8px;\">\n          <span style=\"color: #A0A0A0; font-size: 14px; font-weight: 500; padding: 6px 10px;\">GitHub<\u002Fspan>\n          <span style=\"background: #F07040; color: #0A0A0A; font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 2px;\">Get started<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 4px; overflow: hidden; margin-bottom: 24px;\">\n      <div style=\"display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid #2A2A2A; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\"><span>Specimen · scrolled state<\u002Fspan><span>h-14 · bg-background/70 · backdrop-blur-md · border-b<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 0 28px; height: 56px; display: flex; align-items: center; justify-content: space-between; background: rgba(10,10,10,0.7); border-bottom: 1px solid #2A2A2A;\">\n        <div style=\"display: flex; align-items: center; gap: 40px;\">\n          <div style=\"display: flex; align-items: center; gap: 8px;\">\n            <div style=\"width: 16px; height: 16px; background: #F07040; clip-path: polygon(0 0, 100% 0, 50% 100%);\"><\u002Fdiv>\n            <span style=\"color: #F4F4F4; font-size: 15px; font-weight: 800; letter-spacing: -0.03em;\">VexCMS<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 4px;\">\n            <span style=\"color: #A0A0A0; font-size: 14px; font-weight: 500; padding: 6px 10px;\">Features<\u002Fspan>\n            <span style=\"color: #A0A0A0; font-size: 14px; font-weight: 500; padding: 6px 10px;\">Roadmap<\u002Fspan>\n            <span style=\"color: #A0A0A0; font-size: 14px; font-weight: 500; padding: 6px 10px;\">Docs<\u002Fspan>\n            <span style=\"color: #A0A0A0; font-size: 14px; font-weight: 500; padding: 6px 10px;\">Admin demo<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 8px;\">\n          <span style=\"color: #A0A0A0; font-size: 14px; font-weight: 500; padding: 6px 10px;\">GitHub<\u002Fspan>\n          <span style=\"background: #F07040; color: #0A0A0A; font-size: 14px; font-weight: 600; padding: 6px 14px; border-radius: 2px;\">Get started<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 18px 28px 28px; display: flex; gap: 28px; align-items: flex-start;\">\n        <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171; padding-top: 3px; white-space: nowrap;\">Mobile &lt; 640<\u002Fdiv>\n        <div style=\"flex: 1; border: 1px solid #2A2A2A; border-radius: 8px; background: #141414; padding: 16px; max-width: 320px;\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; padding-bottom: 14px; border-bottom: 1px solid #2A2A2A;\">\n            <span style=\"color: #F4F4F4; font-size: 15px; font-weight: 800; letter-spacing: -0.03em;\">VexCMS<\u002Fspan>\n            <div style=\"display: flex; flex-direction: column; gap: 4px; padding: 6px;\"><span style=\"width: 16px; height: 1.5px; background: #A0A0A0; display: block;\"><\u002Fspan><span style=\"width: 16px; height: 1.5px; background: #A0A0A0; display: block;\"><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 2px; padding-top: 12px;\">\n            <span style=\"color: #F4F4F4; font-size: 16px; font-weight: 500; padding: 10px 8px;\">Features<\u002Fspan>\n            <span style=\"color: #F4F4F4; font-size: 16px; font-weight: 500; padding: 10px 8px;\">Roadmap<\u002Fspan>\n            <span style=\"color: #F4F4F4; font-size: 16px; font-weight: 500; padding: 10px 8px;\">Docs<\u002Fspan>\n            <span style=\"color: #F4F4F4; font-size: 16px; font-weight: 500; padding: 10px 8px;\">Admin demo<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 14px; margin-top: 12px; border-top: 1px solid #2A2A2A;\">\n            <span style=\"border: 1px solid #2A2A2A; color: #F4F4F4; font-size: 15px; font-weight: 500; padding: 11px 14px; border-radius: 2px; text-align: center;\">GitHub<\u002Fspan>\n            <span style=\"background: #F07040; color: #0A0A0A; font-size: 15px; font-weight: 600; padding: 11px 14px; border-radius: 2px; text-align: center;\">Get started<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 168px 1fr; gap: 0 24px; font-size: 14px; line-height: 1.6;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Fields<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">logoText<\u002Fspan> → wordmark, Geist 800, 15px, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">-0.03em<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-foreground<\u002Fspan>. <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">logoImage<\u002Fspan> renders instead at <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">h-5 w-auto<\u002Fspan> when present; the 16px chevron glyph is inline SVG in the layout, not media, so a fresh scaffold always has a mark. <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">menuItems<\u002Fspan> → nav links. <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">actionButtons[].variant<\u002Fspan> maps 1:1 to <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Button<\u002Fspan> variants.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Layout<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">sticky top-0 z-50<\u002Fspan>. Inner: container, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">flex items-center justify-between<\u002Fspan>, height <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">h-14<\u002Fspan> mobile / <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">h-16<\u002Fspan> at <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">md<\u002Fspan>, dropping to <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">h-14<\u002Fspan> once scrolled. Left cluster <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">gap-10<\u002Fspan> (logo + nav); nav links <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">gap-1<\u002Fspan> with 10px inner padding so the hover chip has room. Nav is <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">hidden md:flex<\u002Fspan>; below <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">md<\u002Fspan> a <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Sheet<\u002Fspan> slides from the top, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">rounded-lg<\u002Fspan>, 44px minimum row height, actions stacked full-width at the bottom behind a <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Separator<\u002Fspan>.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Scroll state<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">At <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">scrollY === 0<\u002Fspan>: no background, no border. Past 8px: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-background/70 backdrop-blur-md border-b border-border<\u002Fspan>, transitioning background/height over 180ms. This is the only client-side listener on the page (<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">passive<\u002Fspan>, rAF-throttled); the mobile trigger and the sheet are the only other client code in the chrome.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">States<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Nav link rest <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground<\u002Fspan> → hover <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-foreground bg-accent<\u002Fspan> (<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">rounded-sm<\u002Fspan>), no underline. Current route: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-foreground<\u002Fspan> + <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-accent<\u002Fspan> held. External links (Docs, Admin demo, GitHub) carry no icon — the destination table is in the footer. Focus-visible per §03. Active <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">translate-y-px<\u002Fspan>.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Overflow<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">7+ menu items at <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">md<\u002Fspan>: nav switches to the mobile Sheet at <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">lg<\u002Fspan> instead — never wrap the bar to two lines, never shrink the type. Zero action buttons: the right cluster disappears and nav stays left. Zero menu items: logo left, actions right, no nav.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"hero\" style=\"margin-bottom: 96px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">05 — Hero · variant full &amp; compact<\u002Fdiv>\n    <h2 style=\"margin: 0 0 28px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">One headline, one command, no illustration.<\u002Fh2>\n\n    <div style=\"background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 4px; overflow: hidden; margin-bottom: 24px;\">\n      <div style=\"display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid #2A2A2A; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\"><span>Specimen · variant \"full\"<\u002Fspan><span>min-h-[90vh] · centred<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 88px 56px 72px; display: flex; flex-direction: column; align-items: center; text-align: center;\">\n        <div style=\"display: inline-flex; align-items: center; gap: 8px; border: 1px solid #2A2A2A; background: #141414; border-radius: 9999px; padding: 5px 6px 5px 12px; margin-bottom: 32px;\">\n          <span style=\"color: #A0A0A0; font-size: 13px; font-weight: 500;\">v0.1.0-alpha — now on npm<\u002Fspan>\n          <span style=\"display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 9999px; background: rgba(240,112,64,0.14); color: #F07040; font-size: 12px;\">→<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"margin: 0; color: #F4F4F4; font-size: 68px; font-weight: 800; line-height: 1.02; letter-spacing: -0.04em; max-width: 18ch;\">The CMS that thinks in types.<\u002Fh3>\n        <p style=\"margin: 28px 0 0; color: #A0A0A0; font-size: 19px; line-height: 1.6; max-width: 60ch; text-wrap: pretty;\">A headless CMS built natively on Convex. Declare your collections in TypeScript and Vex generates the Convex schema, the types, and the queries — no translation layer. Every edit reaches every subscriber in milliseconds.<\u002Fp>\n        <div style=\"display: flex; gap: 12px; margin-top: 40px;\">\n          <span style=\"background: #F07040; color: #0A0A0A; font-size: 15px; font-weight: 600; padding: 11px 20px; border-radius: 2px;\">Read the docs<\u002Fspan>\n          <span style=\"border: 1px solid #2A2A2A; color: #F4F4F4; font-size: 15px; font-weight: 500; padding: 11px 20px; border-radius: 2px;\">View on GitHub<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: inline-flex; align-items: center; gap: 14px; margin-top: 28px; border: 1px solid #2A2A2A; background: #111111; border-radius: 2px; padding: 9px 10px 9px 14px;\">\n          <span style=\"color: #717171; font-family: 'Geist Mono', monospace; font-size: 13px;\">$<\u002Fspan>\n          <span style=\"color: #F4F4F4; font-family: 'Geist Mono', monospace; font-size: 13px;\">pnpm create vexcms@latest<\u002Fspan>\n          <span style=\"display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 2px; background: #1E1E1E; border: 1px solid #2A2A2A; color: #A0A0A0; font-size: 11px; font-family: 'Geist Mono', monospace;\">⧉<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 4px; overflow: hidden; margin-bottom: 24px;\">\n      <div style=\"display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid #2A2A2A; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\"><span>Specimen · variant \"compact\"<\u002Fspan><span>left-aligned band · border-b<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 64px 56px 48px; border-bottom: 1px solid #2A2A2A;\">\n        <div style=\"color: #A0A0A0; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 20px;\">Features<\u002Fdiv>\n        <h3 style=\"margin: 0; color: #F4F4F4; font-size: 48px; font-weight: 700; line-height: 1.12; letter-spacing: -0.03em; max-width: 24ch;\">Everything comes from one schema.<\u002Fh3>\n        <p style=\"margin: 20px 0 0; color: #A0A0A0; font-size: 18px; line-height: 1.6; max-width: 64ch; text-wrap: pretty;\">Collections, the Convex tables behind them, the TypeScript types, the Zod validators, the admin forms, and the access rules are all derived from the same declaration.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 168px 1fr; gap: 0 24px; font-size: 14px; line-height: 1.6;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Full · layout<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">min-h-[90vh]<\u002Fspan>, container, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">flex flex-col items-center justify-center text-center<\u002Fspan>, padding <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">pt-24 pb-16 / md:pt-32 pb-20 / xl:pt-40 pb-28<\u002Fspan> (the header is transparent over it, so top padding absorbs the 64px bar). Measures: h1 <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">max-w-[18ch]<\u002Fspan>, subheading <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">max-w-[60ch]<\u002Fspan> — both centred. Stack: badge → 32px → h1 → 28px → sub → 40px → CTAs → 28px → install row (mobile 24 / 20 / 32 / 20).<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Full · background<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Replaces the sourced radial gradients with a token-safe pair: (1) a 1px hairline grid, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">background-image: linear-gradient(to right, var(--color-border) 1px, transparent 1px)<\u002Fspan> at <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">80px<\u002Fspan> pitch, masked to 22% opacity and faded out by <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">mask-image: radial-gradient(ellipse at 50% 0%, black, transparent 70%)<\u002Fspan>; (2) one <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-primary/10 blur-[120px]<\u002Fspan> ellipse, 640×320, centred behind the h1. Both are <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">aria-hidden<\u002Fspan>, absolutely positioned, and derive entirely from tokens, so a light theme softens rather than breaks them. No image, ever.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Badge<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-card border-border rounded-4xl<\u002Fspan>, 13px/500 <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground<\u002Fspan>, padding <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">py-[5px] pl-3 pr-[6px]<\u002Fspan>, trailing 20px <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-primary/14 text-primary<\u002Fspan> circle holding <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">ArrowRight<\u002Fspan> at 12px. Renders as a link only when <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">badgeLink<\u002Fspan> is set; hover then lifts the border to <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border-primary/40<\u002Fspan> and the arrow circle to <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-primary/22<\u002Fspan>. Blank <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">badgeText<\u002Fspan> removes the badge and its 32px gap outright.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Install row<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Client component (the only one in the hero). <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">inline-flex<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-[--color-code-bg] border-border rounded-sm<\u002Fspan>, mono 13px, dimmed <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">$<\u002Fspan> prompt in <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground<\u002Fspan> that is <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">aria-hidden<\u002Fspan> and excluded from the copied string. Copy control is <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Button size=\"icon-xs\" variant=\"ghost\"<\u002Fspan> with <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Copy<\u002Fspan> → <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Check<\u002Fspan> for 1.6s, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-primary<\u002Fspan> while confirmed, with an <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">aria-live=\"polite\"<\u002Fspan> \"Copied\" for screen readers and a <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Tooltip<\u002Fspan> at <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">md<\u002Fspan>+. Below 640 the row goes <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">flex w-full<\u002Fspan> with the command truncating at <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">overflow-x-auto<\u002Fspan>, never wrapping to two lines.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">CTAs<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Primary <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Button size=\"lg\"<\u002Fspan> default variant, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-primary text-primary-foreground<\u002Fspan>, hover <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-primary/90<\u002Fspan> — text colour never changes. Secondary <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">variant=\"outline\"<\u002Fspan>, hover <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-accent text-accent-foreground<\u002Fspan>. Row is <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">flex gap-3<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">flex-col w-full max-w-[320px]<\u002Fspan> below 640 with primary first. Secondary CTA fields blank → single button, row stays centred.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Compact · layout<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">No <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">min-h<\u002Fspan>, no install row, no decorative background, no CTAs (both CTA field pairs are left blank in the seed; if filled they render as a <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">size=\"default\"<\u002Fspan> row 32px under the subheading). Left-aligned, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">pt-28 pb-10 / md:pt-32 pb-14 / xl:pt-36 pb-16<\u002Fspan>, closed with <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border-b border-border<\u002Fspan> so the page below starts against a rule. <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">badgeText<\u002Fspan> renders as the eyebrow label — 12px/500/+0.08em uppercase <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground<\u002Fspan>, no pill, no arrow, 20px above the h1. h1 <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">max-w-[24ch]<\u002Fspan>, subheading <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">max-w-[64ch]<\u002Fspan>.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Overflow<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">The h1 is sized so the home headline sets on two lines at desktop; a three-line headline is a valid state — <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-wrap: balance<\u002Fspan> on h1, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">pretty<\u002Fspan> on the subheading, and no <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">min-h<\u002Fspan> on the text column, so it grows downward without touching the badge or CTA spacing. Never clamp or truncate hero copy. Blank subheading: h1 to CTAs collapses to 32px.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Motion<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Per §03. <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">&lt;TextEffect per=\"word\" delay={0.08} stagger={0.04}&gt;<\u002Fspan> on the h1 only; everything else is a single <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">AnimatedItem<\u002Fspan>. Reduced motion paints the final state with no animation. The decorative background never animates.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"stats\" style=\"margin-bottom: 96px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">06 — Stats · new<\u002Fdiv>\n    <h2 style=\"margin: 0 0 28px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">Four numbers on a raised band.<\u002Fh2>\n\n    <div style=\"background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 4px; overflow: hidden; margin-bottom: 24px;\">\n      <div style=\"display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid #2A2A2A; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\"><span>Specimen · 4 items, no heading<\u002Fspan><span>bg-card · border-y · 4 cols<\u002Fspan><\u002Fdiv>\n      <div style=\"background: #141414; border-top: 1px solid #2A2A2A; border-bottom: 1px solid #2A2A2A; padding: 56px 0;\">\n        <div style=\"display: grid; grid-template-columns: repeat(4, 1fr);\">\n          <div style=\"padding: 0 32px;\">\n            <div style=\"color: #F4F4F4; font-size: 56px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;\">12<\u002Fdiv>\n            <div style=\"color: #F4F4F4; font-size: 15px; font-weight: 600; margin-top: 14px;\">field types<\u002Fdiv>\n            <div style=\"color: #A0A0A0; font-size: 13.5px; line-height: 1.55; margin-top: 8px; max-width: 30ch;\">text, url, number, checkbox, select, date, color, upload, relationship, group, array, blocks<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 0 32px; border-left: 1px solid #2A2A2A;\">\n            <div style=\"color: #F4F4F4; font-size: 56px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;\">8<\u002Fdiv>\n            <div style=\"color: #F4F4F4; font-size: 15px; font-weight: 600; margin-top: 14px;\">published packages<\u002Fdiv>\n            <div style=\"color: #A0A0A0; font-size: 13.5px; line-height: 1.55; margin-top: 8px; max-width: 30ch;\">core, react, next, cli, better-auth, file-storage-convex, richtext-plate, create-vexcms<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 0 32px; border-left: 1px solid #2A2A2A;\">\n            <div style=\"color: #F4F4F4; font-size: 56px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;\">0<\u002Fdiv>\n            <div style=\"color: #F4F4F4; font-size: 15px; font-weight: 600; margin-top: 14px;\">database config<\u002Fdiv>\n            <div style=\"color: #A0A0A0; font-size: 13.5px; line-height: 1.55; margin-top: 8px; max-width: 30ch;\">Convex is the database. There is no connection string<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 0 32px; border-left: 1px solid #2A2A2A;\">\n            <div style=\"color: #F4F4F4; font-size: 56px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;\">1<\u002Fdiv>\n            <div style=\"color: #F4F4F4; font-size: 15px; font-weight: 600; margin-top: 14px;\">command to start<\u002Fdiv>\n            <div style=\"color: #A0A0A0; font-size: 13.5px; line-height: 1.55; margin-top: 8px; max-width: 30ch;\">pnpm create vexcms@latest scaffolds Next.js, Convex, auth, and the admin panel<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 24px 28px 28px; display: flex; gap: 28px; align-items: flex-start;\">\n        <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171; padding-top: 3px; white-space: nowrap;\">Mixed widths<\u002Fdiv>\n        <div style=\"display: flex; gap: 40px; align-items: baseline;\">\n          <div style=\"color: #F4F4F4; font-size: 56px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;\">0<\u002Fdiv>\n          <div style=\"color: #F4F4F4; font-size: 56px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;\">12<\u002Fdiv>\n          <div style=\"color: #F4F4F4; font-size: 56px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;\">~30s<\u002Fdiv>\n          <div style=\"color: #F4F4F4; font-size: 56px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;\">99.9%<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 168px 1fr; gap: 0 24px; font-size: 14px; line-height: 1.6;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mo
