pan> keeps the seam legible. The footer sits directly under the CTA with no gap; its own <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border-t<\u002Fspan> is suppressed when it follows a bordered block (double 1px rules are the one seam artefact to avoid).<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"roadmap\" style=\"margin-bottom: 96px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">13 — Roadmap · four statuses<\u002Fdiv>\n    <h2 style=\"margin: 0 0 16px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">Two shipped items look like a list. Two in-progress items look like news.<\u002Fh2>\n    <p style=\"margin: 0 0 32px; font-size: 15px; line-height: 1.65; color: #2E2E2E; max-width: 64ch; text-wrap: pretty;\">33 items in four buckets of wildly different size. The design solves that by giving each bucket a different density instead of a different colour: In progress gets cards, Planned and Exploring get rows, Shipped gets a two-column dense checklist.<\u002Fp>\n\n    <div style=\"background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 4px; overflow: hidden; margin-bottom: 24px;\">\n      <div style=\"display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid #2A2A2A; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\"><span>Specimen · grouped, abridged<\u002Fspan><span>In progress → Planned → Exploring → Shipped<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 48px 40px;\">\n        <div style=\"display: flex; align-items: center; gap: 2px; border-bottom: 1px solid #2A2A2A; padding-bottom: 12px; margin-bottom: 40px;\">\n          <span style=\"color: #F4F4F4; font-size: 13px; font-weight: 500; padding: 5px 12px; border-radius: 2px; background: #1E1E1E;\">All 33<\u002Fspan>\n          <span style=\"color: #A0A0A0; font-size: 13px; font-weight: 500; padding: 5px 12px;\">Shipped 15<\u002Fspan>\n          <span style=\"color: #A0A0A0; font-size: 13px; font-weight: 500; padding: 5px 12px;\">In progress 2<\u002Fspan>\n          <span style=\"color: #A0A0A0; font-size: 13px; font-weight: 500; padding: 5px 12px;\">Planned 14<\u002Fspan>\n          <span style=\"color: #A0A0A0; font-size: 13px; font-weight: 500; padding: 5px 12px;\">Exploring 2<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 20px;\">\n          <span style=\"display: inline-flex; align-items: center; gap: 7px; border: 1px solid rgba(240,112,64,0.4); background: rgba(240,112,64,0.12); color: #F07040; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 10px; border-radius: 9999px;\"><span style=\"width: 5px; height: 5px; border-radius: 9999px; background: #F07040; display: inline-block; animation: livepulse 2s cubic-bezier(0.2,0.8,0.2,1) infinite;\"><\u002Fspan>In progress<\u002Fspan>\n          <span style=\"color: #717171; font-family: 'Geist Mono', monospace; font-size: 12px;\">2<\u002Fspan>\n          <span style=\"flex: 1; height: 1px; background: #2A2A2A;\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 44px;\">\n          <div style=\"background: #141414; border: 1px solid #2A2A2A; border-radius: 4px; padding: 20px 22px;\">\n            <div style=\"color: #F4F4F4; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;\">Versioning &amp; drafts<\u002Fdiv>\n            <p style=\"margin: 8px 0 0; color: #A0A0A0; font-size: 14px; line-height: 1.6;\">Document history with draft and published states, and a publish action in the admin panel.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: #141414; border: 1px solid #2A2A2A; border-radius: 4px; padding: 20px 22px;\">\n            <div style=\"color: #F4F4F4; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;\">Live preview<\u002Fdiv>\n            <p style=\"margin: 8px 0 0; color: #A0A0A0; font-size: 14px; line-height: 1.6;\">Edit a document beside a rendering of the page it appears on.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 16px;\">\n          <span style=\"display: inline-flex; align-items: center; gap: 7px; border: 1px solid #2A2A2A; color: #A0A0A0; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 10px; border-radius: 9999px;\"><span style=\"width: 5px; height: 5px; border-radius: 9999px; border: 1px solid #717171; display: inline-block;\"><\u002Fspan>Planned<\u002Fspan>\n          <span style=\"color: #717171; font-family: 'Geist Mono', monospace; font-size: 12px;\">14<\u002Fspan>\n          <span style=\"flex: 1; height: 1px; background: #2A2A2A;\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 40px; margin-bottom: 44px;\">\n          <div style=\"display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid #2A2A2A;\"><span style=\"color: #717171; font-size: 13px; line-height: 1.6;\">○<\u002Fspan><div><div style=\"color: #F4F4F4; font-size: 15px; line-height: 1.5;\">Form builder<\u002Fdiv><div style=\"color: #A0A0A0; font-size: 13.5px; line-height: 1.55; margin-top: 3px;\">Collect submissions with generated validation.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid #2A2A2A;\"><span style=\"color: #717171; font-size: 13px; line-height: 1.6;\">○<\u002Fspan><div><div style=\"color: #F4F4F4; font-size: 15px; line-height: 1.5;\">richtext field<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid #2A2A2A;\"><span style=\"color: #717171; font-size: 13px; line-height: 1.6;\">○<\u002Fspan><div><div style=\"color: #F4F4F4; font-size: 15px; line-height: 1.5;\">Lifecycle hooks<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid #2A2A2A;\"><span style=\"color: #717171; font-size: 13px; line-height: 1.6;\">○<\u002Fspan><div><div style=\"color: #F4F4F4; font-size: 15px; line-height: 1.5;\">TanStack Start adapter<\u002Fdiv><div style=\"color: #A0A0A0; font-size: 13.5px; line-height: 1.55; margin-top: 3px;\">A second framework adapter beside Next.js.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 16px;\">\n          <span style=\"display: inline-flex; align-items: center; gap: 7px; border: 1px dashed #2A2A2A; color: #717171; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 10px; border-radius: 9999px;\">Exploring<\u002Fspan>\n          <span style=\"color: #717171; font-family: 'Geist Mono', monospace; font-size: 12px;\">2<\u002Fspan>\n          <span style=\"flex: 1; height: 1px; background: #2A2A2A;\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 44px;\">\n          <span style=\"border: 1px dashed #2A2A2A; color: #A0A0A0; font-size: 14px; padding: 7px 12px; border-radius: 2px;\">Multi-component workspaces<\u002Fspan>\n          <span style=\"border: 1px dashed #2A2A2A; color: #A0A0A0; font-size: 14px; padding: 7px 12px; border-radius: 2px;\">Analytics adapter<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 12px;\">\n          <span style=\"display: inline-flex; align-items: center; gap: 7px; border: 1px solid #2A2A2A; background: #141414; color: #A0A0A0; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 10px; border-radius: 9999px;\"><span style=\"color: #F07040;\">✓<\u002Fspan>Shipped<\u002Fspan>\n          <span style=\"color: #717171; font-family: 'Geist Mono', monospace; font-size: 12px;\">15<\u002Fspan>\n          <span style=\"flex: 1; height: 1px; background: #2A2A2A;\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 40px;\">\n          <div style=\"display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #1E1E1E;\"><span style=\"color: #F07040; font-size: 12px; line-height: 1.6;\">✓<\u002Fspan><span style=\"color: #A0A0A0; font-size: 14.5px; line-height: 1.5;\">12 field types<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #1E1E1E;\"><span style=\"color: #F07040; font-size: 12px; line-height: 1.6;\">✓<\u002Fspan><span style=\"color: #A0A0A0; font-size: 14.5px; line-height: 1.5;\">Convex schema and type codegen<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #1E1E1E;\"><span style=\"color: #F07040; font-size: 12px; line-height: 1.6;\">✓<\u002Fspan><span style=\"color: #A0A0A0; font-size: 14.5px; line-height: 1.5;\">Real-time admin panel<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #1E1E1E;\"><span style=\"color: #F07040; font-size: 12px; line-height: 1.6;\">✓<\u002Fspan><span style=\"color: #A0A0A0; font-size: 14.5px; line-height: 1.5;\">DataTable with pagination and bulk operations<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #1E1E1E;\"><span style=\"color: #F07040; font-size: 12px; line-height: 1.6;\">✓<\u002Fspan><span style=\"color: #A0A0A0; font-size: 14.5px; line-height: 1.5;\">Media library<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #1E1E1E;\"><span style=\"color: #F07040; font-size: 12px; line-height: 1.6;\">✓<\u002Fspan><span style=\"color: #A0A0A0; font-size: 14.5px; line-height: 1.5;\">RBAC with indexed access<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 168px 1fr; gap: 0 24px; font-size: 14px; line-height: 1.6;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Grouping<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">The renderer buckets <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">items<\u002Fspan> by <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">status<\u002Fspan> and prints groups in a fixed order: <strong style=\"font-weight: 600;\">In progress → Planned → Exploring → Shipped<\u002Fstrong>. That is a deliberate departure from the brief's listed order: In progress is the most interesting bucket and the page's news, Shipped is 15 items of reassurance that people skim. Array order within a bucket is preserved exactly as authored. An empty bucket prints nothing — no \"0\" header. Group gap 44px; group header to content 20px (cards) or 16px (rows).<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Group header<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">flex items-center gap-3<\u002Fspan>: status <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Badge<\u002Fspan> → count in mono 12px <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground<\u002Fspan> → <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">flex-1 h-px bg-border<\u002Fspan>. Headings are the badges themselves (each <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">h3 sr-only<\u002Fspan> text supplies the accessible name), which is why no group needs a 30px title competing with the page h1.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Four statuses<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">All four use the same <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Badge<\u002Fspan> geometry — <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">rounded-4xl px-2.5 py-[3px]<\u002Fspan>, 12px/500/+0.04em uppercase — and differ only in border, fill, and leading glyph, so no second accent hue is introduced. <strong style=\"font-weight: 600;\">In progress<\u002Fstrong>: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border-primary/40 bg-primary/12 text-primary<\u002Fspan> + 5px <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-primary<\u002Fspan> dot running <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">livepulse<\u002Fspan> (the one blessed loop). <strong style=\"font-weight: 600;\">Planned<\u002Fstrong>: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border-border text-muted-foreground<\u002Fspan>, transparent, hollow 5px ring dot. <strong style=\"font-weight: 600;\">Exploring<\u002Fstrong>: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border-dashed border-border text-muted-foreground<\u002Fspan>, no dot — dashed is the \"not committed\" signal. <strong style=\"font-weight: 600;\">Shipped<\u002Fstrong>: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-card border-border text-muted-foreground<\u002Fspan> + <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Check size-3 text-primary<\u002Fspan>. Status is never conveyed by colour alone — glyph, border style, and bucket position all carry it.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Density per bucket<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><strong style=\"font-weight: 600;\">In progress<\u002Fstrong> — cards: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">grid md:grid-cols-2 gap-4<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-card border border-border rounded-md p-5<\u002Fspan>, feature 17px/600, description 14px/1.6 muted. <strong style=\"font-weight: 600;\">Planned<\u002Fstrong> — rows: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">grid md:grid-cols-2 gap-x-10<\u002Fspan>, each <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">flex gap-3 py-[11px] border-b border-border<\u002Fspan>, feature 15px, description 13.5px muted on the line below, hollow-circle glyph. <strong style=\"font-weight: 600;\">Exploring<\u002Fstrong> — chips: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">flex flex-wrap gap-2<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border-dashed border-border rounded-sm px-3 py-[7px]<\u002Fspan>, 14px muted; a description, if present, becomes a <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Tooltip<\u002Fspan> and the chip gets <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">cursor-help<\u002Fspan>. <strong style=\"font-weight: 600;\">Shipped<\u002Fstrong> — checklist: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">grid md:grid-cols-2 xl:grid-cols-2 gap-x-10<\u002Fspan>, rows <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">py-2 border-b border-border/60<\u002Fspan>, 14.5px <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground<\u002Fspan> — smaller and quieter than every other bucket on purpose; descriptions are rendered but at 13px, and 15 rows occupy about 320px.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Filter<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">A <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Tabs<\u002Fspan> row above the groups — <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">All 33 · Shipped 15 · In progress 2 · Planned 14 · Exploring 2<\u002Fspan> — <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">h-10 border-b border-border<\u002Fspan>, triggers 13px/500 <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">rounded-sm px-3 py-[5px]<\u002Fspan>, selected <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-accent text-foreground<\u002Fspan>. Counts come from the array, never hardcoded. It is the only client component on the page; with all groups rendered server-side and toggled by <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">hidden<\u002Fspan>, filtering costs no request and the page works with JS disabled (all groups visible). Fewer than 8 items total: the tab row is not rendered. Below <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">md<\u002Fspan> it becomes a horizontally scrollable row (<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">ScrollArea<\u002Fspan>), never a <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Select<\u002Fspan>.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Empty &amp; overflow<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">No description (common): the row is one line and the glyph stays baseline-aligned to it — because rows are rules rather than cards, a mixed list of 1-line and 2-line rows reads as a table, not as breakage. All 33 items with descriptions: the page grows; no truncation, no clamping. A single item in a bucket: cards go full width at <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">md<\u002Fspan> rather than sitting half-empty (<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">md:grid-cols-2<\u002Fspan> only when the bucket has ≥2 items). A feature name that wraps to two lines is fine at every density. Padding <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">py-14 md:py-20 xl:py-24<\u002Fspan>; mobile collapses every grid to one column.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"footer\" style=\"margin-bottom: 96px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">14 — Footer · site chrome<\u002Fdiv>\n    <h2 style=\"margin: 0 0 28px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">One rule, one row of links, one line of law.<\u002Fh2>\n\n    <div style=\"background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 4px; overflow: hidden; margin-bottom: 24px;\">\n      <div style=\"display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid #2A2A2A; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171;\"><span>Specimen · 8 links, 1 social<\u002Fspan><span>wrapping row · not a 4-col sitemap<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 48px 40px 32px;\">\n        <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 48px; padding-bottom: 32px; border-bottom: 1px solid #2A2A2A;\">\n          <div style=\"display: flex; align-items: center; gap: 8px;\">\n            <div style=\"width: 16px; height: 16px; background: #F07040; clip-path: polygon(0 0, 100% 0, 50% 100%);\"><\u002Fdiv>\n            <span style=\"color: #F4F4F4; font-size: 15px; font-weight: 800; letter-spacing: -0.03em;\">VexCMS<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px 28px; justify-content: flex-end; max-width: 640px;\">\n            <span style=\"color: #A0A0A0; font-size: 14px;\">Features<\u002Fspan>\n            <span style=\"color: #A0A0A0; font-size: 14px;\">Roadmap<\u002Fspan>\n            <span style=\"color: #A0A0A0; font-size: 14px;\">Docs<\u002Fspan>\n            <span style=\"color: #A0A0A0; font-size: 14px;\">Quickstart<\u002Fspan>\n            <span style=\"color: #A0A0A0; font-size: 14px;\">Admin demo<\u002Fspan>\n            <span style=\"color: #A0A0A0; font-size: 14px;\">npm<\u002Fspan>\n            <span style=\"color: #A0A0A0; font-size: 14px;\">Licence<\u002Fspan>\n            <span style=\"color: #A0A0A0; font-size: 14px;\">Convex<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; justify-content: space-between; padding-top: 20px;\">\n          <span style=\"color: #717171; font-size: 13px;\">© 2026 VexCMS. Apache-2.0 licensed.<\u002Fspan>\n          <span style=\"display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid #2A2A2A; border-radius: 2px; color: #A0A0A0; font-size: 13px;\">⌥<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 168px 1fr; gap: 0 24px; font-size: 14px; line-height: 1.6;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Layout<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border-t border-border<\u002Fspan> (suppressed after a bordered block), <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">py-12 md:py-14<\u002Fspan>, container. Row 1: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">flex items-start justify-between gap-12<\u002Fspan> — logo left, links right as a <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">flex flex-wrap gap-x-7 gap-y-2 justify-end max-w-[640px]<\u002Fspan> row; closed with <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border-b border-border pb-8<\u002Fspan>. Row 2: copyright left, socials right, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">pt-5<\u002Fspan>. Mobile: everything stacks left-aligned, links become a 2-column grid, socials sit under the copyright with 20px gap. Tailark's footer three supplies the wrapping-link-row idea; its multi-column sitemap is dropped because the <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">links<\u002Fspan> field is one flat array with no group labels — an invented 4-column grouping would be content the CMS cannot express.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Type &amp; states<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Links 14px <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground<\u002Fspan> → hover <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-foreground<\u002Fspan>, no underline (the row is dense; eight underlines is noise). Copyright 13px <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-muted-foreground<\u002Fspan>, prefixed with <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">© {year}<\u002Fspan> generated at render. Socials: 32px <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Button variant=\"ghost\" size=\"icon-sm\"<\u002Fspan> with <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">border border-border rounded-sm<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Icon size-4<\u002Fspan> resolved from <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">icon<\u002Fspan> (<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">\"Github\"<\u002Fspan>), falling back to the <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">platform<\u002Fspan> string as a 13px text link if the icon name does not resolve — the footer never renders an empty square. <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">aria-label<\u002Fspan> comes from <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">platform<\u002Fspan>.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Empty states<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">No <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">logoImage<\u002Fspan>: wordmark + inline chevron, as in the header. No <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">links<\u002Fspan>: row 1 is the logo alone and its bottom rule is dropped, leaving a single-line footer. No <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">socialLinks<\u002Fspan>: copyright sits alone, still left-aligned. 20+ links wrap to three lines and the row keeps <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">justify-end<\u002Fspan> at <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">md<\u002Fspan>+.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"border-top: 1px solid #0A0A0A; padding-top: 40px; margin-bottom: 64px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #A0A0A0;\">Part C<\u002Fdiv>\n    <h2 style=\"margin: 12px 0 0; font-size: 44px; font-weight: 800; line-height: 1.05; letter-spacing: -0.035em;\">Three pages, in order.<\u002Fh2>\n    <p style=\"margin: 20px 0 0; font-size: 17px; line-height: 1.6; color: #2E2E2E; max-width: 62ch; text-wrap: pretty;\">Section order, variant, and the surface each block paints. Everything else is in Part B — these are seed compositions, not new designs.<\u002Fp>\n  <\u002Fdiv>\n\n  <section id=\"page-home\" style=\"margin-bottom: 72px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">15 — Page · /<\u002Fdiv>\n    <h2 style=\"margin: 0 0 8px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">What it is, what's true, how to start.<\u002Fh2>\n    <p style=\"margin: 0 0 28px; font-size: 15px; line-height: 1.65; color: #717171;\">Seven blocks. Surface alternates exactly twice, so the whole scroll has two background values.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: 28px 148px 1fr 132px; gap: 0 20px; font-size: 14px; line-height: 1.6; align-items: start;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #A0A0A0;\">01<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-weight: 600;\">Hero · full<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Badge → npm. h1 “The CMS that thinks in types.” Install row <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">pnpm create vexcms@latest<\u002Fspan>. CTAs: docs quickstart (primary), GitHub (outline). Hairline grid + one primary blur ellipse behind.<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #717171;\">bg-background<br>min-h-[90vh]<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #A0A0A0;\">02<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-weight: 600;\">Stats<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">No heading — four dividers do the talking. 12 field types · 8 published packages · 0 database config · 1 command to start.<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #717171;\">bg-card<br>border-y · py-16<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #A0A0A0;\">03<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-weight: 600;\">Features<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Six cards, hairline mesh, 3 cols at <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">xl<\u002Fspan>. Icons Wand · ShieldCheck · Radio · Lock · Boxes · LayoutGrid.<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #717171;\">bg-background<br>py-28<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #A0A0A0;\">04<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-weight: 600;\">CodeShowcase<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">“Write the config. Get the types.” Two panes in one frame: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">config.ts<\u002Fspan> (label in primary) beside <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">vex.types.ts<\u002Fspan> with its auto-generated banner as the first comment line. The page's centre of gravity — nothing above or below it competes for attention.<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #717171;\">bg-background<br>py-28<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #A0A0A0;\">05<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-weight: 600;\">HowItWorks<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Four steps on the numbered rail. Terminal · Code · LayoutGrid · Rocket.<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #717171;\">bg-background<br>py-28<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #A0A0A0;\">06<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-weight: 600;\">FAQ<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">“Questions we keep getting.” Six items; “Is it production ready?” answers <em>no<\u002Fem> — alpha, with versioning, drafts, and live preview named as in progress. Support link → issues.<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #717171;\">bg-background<br>py-28<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #A0A0A0;\">07<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-weight: 600;\">CTA<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">“Start with a schema. Ship in an hour.” Two actions. Footer follows immediately, border suppressed.<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #717171;\">bg-card<br>border-y · py-32<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"page-features\" style=\"margin-bottom: 72px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">16 — Page · /features<\u002Fdiv>\n    <h2 style=\"margin: 0 0 8px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">One schema, argued three ways.<\u002Fh2>\n    <p style=\"margin: 0 0 28px; font-size: 15px; line-height: 1.65; color: #717171;\">Three Splits alternate right / left / right. The page must stand alone for search traffic, so Features repeats verbatim.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: 28px 148px 1fr 132px; gap: 0 20px; font-size: 14px; line-height: 1.6; align-items: start;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #A0A0A0;\">01<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-weight: 600;\">Hero · compact<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Eyebrow “Features”, h1 “Everything comes from one schema.”, subheading naming the six derived artefacts. Closes with a rule.<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #717171;\">bg-background<br>border-b<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #A0A0A0;\">02<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-weight: 600;\">Features<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">The same six cards, same order, same icons.<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #717171;\">bg-background<br>py-28<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #A0A0A0;\">03<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-weight: 600;\">Split · code right<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Fields → “Twelve field types. One generator.” Bullets Layers · Blocks · Palette. Pane: a <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">defineCollection<\u002Fspan> using text, relationship, color, blocks.<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #717171;\">bg-background<br>py-28<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #A0A0A0;\">04<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-weight: 600;\">Split · code left<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Access control → “Access rules that compile to indexes.” Bullets Lock · KeyRound · Globe (the anon-role fallback is what makes the read-only <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">/admin<\u002Fspan> demo possible).<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #717171;\">bg-background<br>py-28<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #A0A0A0;\">05<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-weight: 600;\">Split · code right<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Beyond content → “Globals, themes, and blocks are collections too.” Bullets Boxes · Palette · Zap.<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #717171;\">bg-background<br>py-28<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #A0A0A0;\">06<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-weight: 600;\">CodeShowcase<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">“One rule. Two consumers.” Access rule as authored beside the generated query signature. Two panes, same frame treatment as home.<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #717171;\">bg-background<br>py-28<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #A0A0A0;\">07<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-weight: 600;\">CTA<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Identical to home — same field values, seeded twice, not shared.<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #717171;\">bg-card<br>border-y · py-32<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"page-roadmap\" style=\"margin-bottom: 96px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">17 — Page · /roadmap<\u002Fdiv>\n    <h2 style=\"margin: 0 0 8px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">33 items, four densities.<\u002Fh2>\n    <p style=\"margin: 0 0 28px; font-size: 15px; line-height: 1.65; color: #717171;\">The shortest page and the one most likely to be checked twice a month. No hero decoration, no CTA above the list.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: 28px 148px 1fr 132px; gap: 0 20px; font-size: 14px; line-height: 1.6; align-items: start;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #A0A0A0;\">01<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-weight: 600;\">Hero · compact<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Eyebrow “Roadmap”, h1 “Shipped, in progress, and being explored.”, subheading stating 0.1.0-alpha and that this page is edited from the admin panel.<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #717171;\">bg-background<br>border-b<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #A0A0A0;\">02<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-weight: 600;\">Roadmap<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Tab filter, then buckets: In progress 2 (cards) → Planned 14 (two-column rows) → Exploring 2 (dashed chips) → Shipped 15 (dense checklist). Status wording is load-bearing: versioning, drafts, and live preview appear only under In progress, and richtext, json, tabs, hooks, scheduling, API keys, teams, TanStack, S3/R2, plugins, and the testing suite only under Planned.<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #717171;\">bg-background<br>py-24<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #A0A0A0;\">03<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-weight: 600;\">CTA<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Identical to home.<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #717171;\">bg-card<br>border-y · py-32<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"border-top: 1px solid #0A0A0A; padding-top: 40px; margin-bottom: 64px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #A0A0A0;\">Part D<\u002Fdiv>\n    <h2 style=\"margin: 12px 0 0; font-size: 44px; font-weight: 800; line-height: 1.05; letter-spacing: -0.035em;\">Handoff.<\u002Fh2>\n  <\u002Fdiv>\n\n  <section id=\"theme\" style=\"margin-bottom: 96px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">18 — Theme document<\u002Fdiv>\n    <h2 style=\"margin: 0 0 16px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">Stark × Ember, tightened.<\u002Fh2>\n    <p style=\"margin: 0 0 28px; font-size: 15px; line-height: 1.65; color: #2E2E2E; max-width: 64ch; text-wrap: pretty;\">Loads into the <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.875em;\">themes<\u002Fspan> collection with no transformation. All 32 keys present in both maps. The palette keeps its position — pure-neutral chrome, one warm ember voice — and moves only where contrast or hierarchy demanded it.<\u002Fp>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px;\">\n      <div style=\"flex: 1; min-width: 240px; background: #FFFFFF; border: 1px solid #E4E4E4; border-radius: 4px; padding: 16px 18px;\">\n        <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171; margin-bottom: 12px;\">Light surfaces<\u002Fdiv>\n        <div style=\"display: flex; gap: 0; border: 1px solid #E4E4E4; border-radius: 2px; overflow: hidden;\">\n          <div style=\"flex: 1; height: 44px; background: #F5F5F5;\"><\u002Fdiv>\n          <div style=\"flex: 1; height: 44px; background: #FFFFFF;\"><\u002Fdiv>\n          <div style=\"flex: 1; height: 44px; background: #EDEDED;\"><\u002Fdiv>\n          <div style=\"flex: 1; height: 44px; background: #FDF1EA;\"><\u002Fdiv>\n          <div style=\"flex: 1; height: 44px; background: #E8622A;\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1; min-width: 240px; background: #FFFFFF; border: 1px solid #E4E4E4; border-radius: 4px; padding: 16px 18px;\">\n        <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #717171; margin-bottom: 12px;\">Dark surfaces<\u002Fdiv>\n        <div style=\"display: flex; gap: 0; border: 1px solid #E4E4E4; border-radius: 2px; overflow: hidden;\">\n          <div style=\"flex: 1; height: 44px; background: #0F0F0F;\"><\u002Fdiv>\n          <div style=\"flex: 1; height: 44px; background: #1B1B1B;\"><\u002Fdiv>\n          <div style=\"flex: 1; height: 44px; background: #232323;\"><\u002Fdiv>\n          <div style=\"flex: 1; height: 44px; background: #2B211D;\"><\u002Fdiv>\n          <div style=\"flex: 1; height: 44px; background: #F07040;\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 4px; padding: 28px; overflow-x: auto; margin-bottom: 28px;\">\n      <pre style=\"margin: 0; font-family: 'Geist Mono', monospace; font-size: 12.5px; line-height: 1.65; color: #C7C7C7;\">{\n  \"name\": \"Stark × Ember\",\n  \"fontFamily\": \"Geist, Inter, system-ui, sans-serif\",\n  \"radius\": \"4px\",\n  \"light\": {\n    \"background\":               \"oklch(96.1% 0 0)\",\n    \"foreground\":               \"oklch(13.7% 0 0)\",\n    \"card\":                     \"oklch(100% 0 0)\",\n    \"cardForeground\":           \"oklch(13.7% 0 0)\",\n    \"popover\":                  \"oklch(100% 0 0)\",\n    \"popoverForeground\":        \"oklch(13.7% 0 0)\",\n    \"primary\":                  \"oklch(58% 0.185 40)\",\n    \"primaryForeground\":        \"oklch(100% 0 0)\",\n    \"secondary\":                \"oklch(92.5% 0 0)\",\n    \"secondaryForeground\":      \"oklch(20% 0 0)\",\n    \"muted\":                    \"oklch(93.5% 0 0)\",\n    \"mutedForeground\":          \"oklch(48% 0 0)\",\n    \"accent\":                   \"oklch(96.5% 0.022 40)\",\n    \"accentForeground\":         \"oklch(38% 0.14 40)\",\n    \"destructive\":              \"oklch(57.7% 0.215 27)\",\n    \"destructiveForeground\":    \"oklch(100% 0 0)\",\n    \"border\":                   \"oklch(89.5% 0 0)\",\n    \"input\":                    \"oklch(89.5% 0 0)\",\n    \"ring\":                     \"oklch(58% 0.185 40)\",\n    \"chart1\":                   \"oklch(58% 0.185 40)\",\n    \"chart2\":                   \"oklch(68% 0.15 55)\",\n    \"chart3\":                   \"oklch(76% 0.11 70)\",\n    \"chart4\":                   \"oklch(45% 0 0)\",\n    \"chart5\":                   \"oklch(72% 0 0)\",\n    \"sidebar\":                  \"oklch(100% 0 0)\",\n    \"sidebarForeground\":        \"oklch(13.7% 0 0)\",\n    \"sidebarPrimary\":           \"oklch(58% 0.185 40)\",\n    \"sidebarPrimaryForeground\": \"oklch(100% 0 0)\",\n    \"sidebarAccent\":            \"oklch(96.5% 0.022 40)\",\n    \"sidebarAccentForeground\":  \"oklch(38% 0.14 40)\",\n    \"sidebarBorder\":            \"oklch(89.5% 0 0)\",\n    \"sidebarRing\":              \"oklch(58% 0.185 40)\"\n  },\n  \"dark\": {\n    \"background\":               \"oklch(13.7% 0 0)\",\n    \"foreground\":               \"oklch(96% 0 0)\",\n    \"card\":                     \"oklch(17.4% 0 0)\",\n    \"cardForeground\":           \"oklch(96% 0 0)\",\n    \"popover\":                  \"oklch(20.5% 0 0)\",\n    \"popoverForeground\":        \"oklch(96% 0 0)\",\n    \"primary\":                  \"oklch(68% 0.178 40)\",\n    \"primaryForeground\":        \"oklch(14% 0 0)\",\n    \"secondary\":                \"oklch(24% 0 0)\",\n    \"secondaryForeground\":      \"oklch(96% 0 0)\",\n    \"muted\":                    \"oklch(22% 0 0)\",\n    \"mutedForeground\":          \"oklch(66% 0 0)\",\n    \"accent\":                   \"oklch(68% 0.178 40 / 0.14)\",\n    \"accentForeground\":         \"oklch(78% 0.13 45)\",\n    \"destructive\":              \"oklch(63% 0.2 27)\",\n    \"destructiveForeground\":    \"oklch(14% 0 0)\",\n    \"border\":                   \"oklch(26.5% 0 0)\",\n    \"input\":                    \"oklch(30% 0 0)\",\n    \"ring\":                     \"oklch(68% 0.178 40)\",\n    \"chart1\":                   \"oklch(68% 0.178 40)\",\n    \"chart2\":                   \"oklch(76% 0.14 55)\",\n    \"chart3\":                   \"oklch(84% 0.1 72)\",\n    \"chart4\":                   \"oklch(55% 0 0)\",\n    \"chart5\":                   \"oklch(35% 0 0)\",\n    \"sidebar\":                  \"oklch(9.5% 0 0)\",\n    \"sidebarForeground\":        \"oklch(96% 0 0)\",\n    \"sidebarPrimary\":           \"oklch(68% 0.178 40)\",\n    \"sidebarPrimaryForeground\": \"oklch(14% 0 0)\",\n    \"sidebarAccent\":            \"oklch(68% 0.178 40 / 0.14)\",\n    \"sidebarAccentForeground\":  \"oklch(78% 0.13 45)\",\n    \"sidebarBorder\":            \"oklch(26.5% 0 0)\",\n    \"sidebarRing\":              \"oklch(68% 0.178 40)\"\n  }\n}<\u002Fpre>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 196px 1fr 96px; gap: 0 20px; font-size: 14px; line-height: 1.6; align-items: start;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #717171;\">Token moved<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Rationale<\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171; text-align: right;\">Contrast<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12.5px; color: #0A0A0A;\">primary (light)<br><span style=\"color: #717171; font-size: 11.5px;\">60.5% → 58%, C .175 → .185<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Matches the design system's Ember Orange exactly (#E8622A) and buys enough darkness for white button text at 15px/600. Still clearly not Convex's orange.<\u002Fdiv>\n      <div style=\"padding: 12px 0; text-align: right; font-family: 'Geist Mono', monospace; font-size: 12.5px; color: #2E2E2E;\">3.6:1<br><span style=\"color: #717171; font-size: 11px;\">white on primary, AA large / bold<\u002Fspan><\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12.5px; color: #0A0A0A;\">primaryForeground (dark)<br><span style=\"color: #717171; font-size: 11.5px;\">white → oklch(14% 0 0)<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">The only reversal of a design-system rule, and it is a legibility fix: white on the brightened dark-mode orange is 2.6:1 and fails everywhere. Near-black on it passes AA at any size. The button reads as a solid ember chip, which is also the stronger look on a near-black page.<\u002Fdiv>\n      <div style=\"padding: 12px 0; text-align: right; font-family: 'Geist Mono', monospace; font-size: 12.5px; color: #2E2E2E;\">6.0:1<br><span style=\"color: #717171; font-size: 11px;\">was 2.6:1<\u002Fspan><\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12.5px; color: #0A0A0A;\">mutedForeground<br><span style=\"color: #717171; font-size: 11.5px;\">light 48% · dark 66%<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Body copy is muted-foreground across the whole site, so it has to clear AA for normal text rather than merely look grey. Both values are the lightest/darkest that still do.<\u002Fdiv>\n      <div style=\"padding: 12px 0; text-align: right; font-family: 'Geist Mono', monospace; font-size: 12.5px; color: #2E2E2E;\">4.9:1 · 5.1:1<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12.5px; color: #0A0A0A;\">border<br><span style=\"color: #717171; font-size: 11.5px;\">light 85% → 89.5% · dark 25% → 26.5%<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">This design leans on 1px rules for structure — hairline card meshes, dividers, seams. At 85% the light border was heavy enough to read as a grid drawing; 89.5% matches the system's #E4E4E4 and lets a six-cell mesh recede. Dark nudged up so a seam is still visible against <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">card<\u002Fspan>.<\u002Fdiv>\n      <div style=\"padding: 12px 0; text-align: right; font-family: 'Geist Mono', monospace; font-size: 12.5px; color: #2E2E2E;\">1.4:1 · 1.5:1<br><span style=\"color: #717171; font-size: 11px;\">non-text, ≥1.3 target<\u002Fspan><\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12.5px; color: #0A0A0A;\">accentForeground<br><span style=\"color: #717171; font-size: 11.5px;\">added, both modes<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">The old palette gave <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">accent<\u002Fspan> a tint with no matching ink, so any hovered nav item inherited body colour. Ember-tinted ink keeps hover states on-brand and legible on the wash.<\u002Fdiv>\n      <div style=\"padding: 12px 0; text-align: right; font-family: 'Geist Mono', monospace; font-size: 12.5px; color: #2E2E2E;\">7.2:1 · 6.8:1<br><span style=\"color: #717171; font-size: 11px;\">on accent<\u002Fspan><\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12.5px; color: #0A0A0A;\">input<br><span style=\"color: #717171; font-size: 11.5px;\">dark 30% vs border 26.5%<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Form inputs need to be findable against a card without a fill; a slightly brighter stroke does it without adding a second surface value.<\u002Fdiv>\n      <div style=\"padding: 12px 0; text-align: right; font-family: 'Geist Mono', monospace; font-size: 12.5px; color: #2E2E2E;\">1.7:1<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12.5px; color: #0A0A0A;\">chart1–5<br><span style=\"color: #717171; font-size: 11.5px;\">ember ramp + 2 neutrals<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">The site has no charts, but the admin panel does and the theme is shared. A ramp from ember through gold to two neutrals keeps the single-accent rule instead of introducing five hues.<\u002Fdiv>\n      <div style=\"padding: 12px 0; text-align: right; font-family: 'Geist Mono', monospace; font-size: 12.5px; color: #717171;\">n/a<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12.5px; color: #0A0A0A;\">sidebar (dark) 9.5%<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Darker than the page, per the system: the admin rail recedes. Unused by marketing, correct for <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">/admin<\u002Fspan>.<\u002Fdiv>\n      <div style=\"padding: 12px 0; text-align: right; font-family: 'Geist Mono', monospace; font-size: 12.5px; color: #717171;\">n/a<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin: 20px 0 0; font-size: 13.5px; line-height: 1.6; color: #717171; max-width: 72ch;\">Unchanged from the current values: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">background<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">foreground<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">card<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">radius<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">fontFamily<\u002Fspan>, and dark <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">accent<\u002Fspan>'s alpha approach. Contrast figures are computed on the sRGB renderings of these oklch values and rounded down.<\u002Fp>\n  <\u002Fsection>\n\n  <section id=\"extra\" style=\"margin-bottom: 96px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">19 — Additional @theme tokens<\u002Fdiv>\n    <h2 style=\"margin: 0 0 16px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">Not per-theme, so not in the record.<\u002Fh2>\n    <p style=\"margin: 0 0 28px; font-size: 15px; line-height: 1.65; color: #2E2E2E; max-width: 64ch; text-wrap: pretty;\">These belong in <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.875em;\">globals.css<\u002Fspan> under <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.875em;\">@theme<\u002Fspan>. The code-pane palette is intentionally fixed: the pane stays dark under a light theme, which is the one deliberate exception to \"the theme decides colour\", and it means shiki runs once per build with one theme.<\u002Fp>\n    <div style=\"background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 4px; padding: 28px; overflow-x: auto;\">\n      <pre style=\"margin: 0; font-family: 'Geist Mono', monospace; font-size: 12.5px; line-height: 1.7; color: #C7C7C7;\">@theme {\n  <span style=\"color: #6E6E6E;\">/* motion */<\u002Fspan>\n  --ease-emphasized: cubic-bezier(0.2, 0.8, 0.2, 1);\n  --duration-fast: 120ms;\n  --duration-base: 180ms;\n  --duration-slow: 260ms;\n\n  <span style=\"color: #6E6E6E;\">/* radius scale — --radius comes from the theme record */<\u002Fspan>\n  --radius-sm: 2px;  --radius-md: 4px;  --radius-lg: 8px;\n  --radius-xl: 12px; --radius-2xl: 16px; --radius-3xl: 20px; --radius-4xl: 9999px;\n\n  <span style=\"color: #6E6E6E;\">/* shadow — light mode only; every use is paired with dark:shadow-none */<\u002Fspan>\n  --shadow-xs: 0 1px 2px rgb(10 10 10 / 0.04);\n  --shadow-sm: 0 1px 3px rgb(10 10 10 / 0.08);\n  --shadow-md: 0 4px 12px rgb(10 10 10 / 0.08);\n  --shadow-lg: 0 12px 32px rgb(10 10 10 / 0.12);\n\n  <span style=\"color: #6E6E6E;\">/* section rhythm — used by every block's padding utilities */<\u002Fspan>\n  --spacing-section: 3.5rem;     <span style=\"color: #6E6E6E;\">/* 56px  mobile  */<\u002Fspan>\n  --spacing-section-md: 5rem;    <span style=\"color: #6E6E6E;\">/* 80px  tablet  */<\u002Fspan>\n  --spacing-section-xl: 7rem;    <span style=\"color: #6E6E6E;\">/* 112px desktop */<\u002Fspan>\n\n  <span style=\"color: #6E6E6E;\">/* code pane — fixed in both themes */<\u002Fspan>\n  --color-code-bg:      oklch(11% 0 0);\n  --color-code-chrome:  oklch(15.5% 0 0);\n  --color-code-border:  oklch(24% 0 0);\n  --color-code-fg:      oklch(84% 0 0);\n  --color-code-dim:     oklch(52% 0 0);   <span style=\"color: #6E6E6E;\">/* comments, prompts */<\u002Fspan>\n  --color-code-key:     oklch(72% 0.16 42); <span style=\"color: #6E6E6E;\">/* keywords, primitives, booleans */<\u002Fspan>\n  --color-code-ident:   oklch(96% 0 0);   <span style=\"color: #6E6E6E;\">/* functions, type names */<\u002Fspan>\n  --color-code-string:  oklch(70% 0 0);   <span style=\"color: #6E6E6E;\">/* strings, slugs */<\u002Fspan>\n  --color-code-punct:   oklch(45% 0 0);\n}<\u002Fpre>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 168px 1fr; gap: 0 24px; font-size: 14px; line-height: 1.6; margin-top: 24px;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Shiki mapping<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\">Build a minimal shiki theme whose scopes point at the five code colours above rather than shipping a stock theme: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">comment<\u002Fspan> → dim · <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">keyword, storage.type, constant.language, support.type.primitive<\u002Fspan> → key · <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">entity.name.function, entity.name.type, support.class<\u002Fspan> → ident · <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">string, constant.numeric<\u002Fspan> → string · <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">punctuation, meta.brace<\u002Fspan> → punct · everything else → <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">code-fg<\u002Fspan>. Five colours is the whole palette: ember appears only on keywords, which is why a config file reads as ember-accented and a generated type file reads as almost entirely neutral — the visual argument of the CodeShowcase section.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Fonts<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">next/font/google<\u002Fspan> — <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Geist<\u002Fspan> (400/500/600/700/800) as <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">--font-sans<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Geist_Mono<\u002Fspan> (400/500) as <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">--font-mono<\u002Fspan>, both <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">display: \"swap\"<\u002Fspan>. The theme record's <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">fontFamily<\u002Fspan> string is the fallback stack applied as a custom property, so an editor can change the family without a redeploy. Mono is enabled with <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">font-feature-settings: \"ss01\" 1, \"calt\" 1<\u002Fspan>.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 12px 0; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #717171;\">Base layer<\u002Fdiv>\n      <div style=\"padding: 12px 0; color: #2E2E2E;\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">::selection<\u002Fspan> → <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-primary/22<\u002Fspan>, colour inherited. Prose links inside <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text<\u002Fspan> field output: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-primary<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">underline-offset-4<\u002Fspan>, <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">decoration-current/40<\u002Fspan> → full on hover. <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">scroll-behavior: smooth<\u002Fspan> only outside reduced motion. A <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">skip to content<\u002Fspan> link in the layout, visually hidden until focused, sits above the sticky header.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"order\" style=\"margin-bottom: 96px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">20 — Build order<\u002Fdiv>\n    <h2 style=\"margin: 0 0 28px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">Coherent at every step.<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: 28px 1fr; gap: 0 20px; font-size: 14px; line-height: 1.6; align-items: start;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 14px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #F07040;\">01<\u002Fdiv>\n      <div style=\"padding: 14px 0; color: #2E2E2E;\"><strong style=\"font-weight: 600; color: #0A0A0A;\">Theme + @theme tokens.<\u002Fstrong> Load the theme record, apply the 32 properties server-side, add §19 to <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">globals.css<\u002Fspan>. Verify a dark/light swap on a bare page before any block exists — every later step assumes it.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 14px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #F07040;\">02<\u002Fdiv>\n      <div style=\"padding: 14px 0; color: #2E2E2E;\"><strong style=\"font-weight: 600; color: #0A0A0A;\">Chrome: Header + Footer.<\u002Fstrong> Sticky behaviour, mobile sheet, wrapping footer row. Now every route has a frame and nothing looks unfinished.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 14px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #F07040;\">03<\u002Fdiv>\n      <div style=\"padding: 14px 0; color: #2E2E2E;\"><strong style=\"font-weight: 600; color: #0A0A0A;\">Hero, both variants.<\u002Fstrong> Build <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">compact<\u002Fspan> first (it is the simpler shape and unblocks the two interior pages), then <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">full<\u002Fspan> with the install row and the decorative background. At the end of this step all three routes render a real page-header.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 14px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #F07040;\">04<\u002Fdiv>\n      <div style=\"padding: 14px 0; color: #2E2E2E;\"><strong style=\"font-weight: 600; color: #0A0A0A;\">CodeShowcase.<\u002Fstrong> The hardest and most important block, and the source of the shared pane primitive Split needs. Do the shiki server pass, the pane chrome, the copy button, the long-line scroll, and the tab mode here — not in a later refactor.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 14px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #F07040;\">05<\u002Fdiv>\n      <div style=\"padding: 14px 0; color: #2E2E2E;\"><strong style=\"font-weight: 600; color: #0A0A0A;\">CTA, then Features.<\u002Fstrong> CTA is 30 minutes and closes all three pages. Features gives home and <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">/features<\u002Fspan> their body. Home is now shippable: hero → features → code → CTA reads as a complete site.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 14px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #F07040;\">06<\u002Fdiv>\n      <div style=\"padding: 14px 0; color: #2E2E2E;\"><strong style=\"font-weight: 600; color: #0A0A0A;\">Stats, HowItWorks, FAQ.<\u002Fstrong> Three independent, low-risk blocks that finish the home page. Stats first — it is the only other <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-card<\u002Fspan> band and it validates the surface rhythm.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 14px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #F07040;\">07<\u002Fdiv>\n      <div style=\"padding: 14px 0; color: #2E2E2E;\"><strong style=\"font-weight: 600; color: #0A0A0A;\">Split.<\u002Fstrong> Reuses step 4's pane. Build <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">code<\u002Fspan>, then <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">none<\u002Fspan>, then <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">image<\u002Fspan> with its fall-through. Completes <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">/features<\u002Fspan>.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 14px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #F07040;\">08<\u002Fdiv>\n      <div style=\"padding: 14px 0; color: #2E2E2E;\"><strong style=\"font-weight: 600; color: #0A0A0A;\">Roadmap.<\u002Fstrong> Last, because it is the only block with real branching logic and it blocks nothing else. Statuses and grouping before the tab filter; the page must be correct with JS disabled first.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 14px 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #F07040;\">09<\u002Fdiv>\n      <div style=\"padding: 14px 0; color: #2E2E2E;\"><strong style=\"font-weight: 600; color: #0A0A0A;\">Seed, then audit.<\u002Fstrong> Run the idempotent seed. Then four passes: theme swap to light on all three pages; <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">prefers-reduced-motion<\u002Fspan>; keyboard-only traversal including the code panes' scroll regions; and a fresh-scaffold check with the media library emptied — no section may look broken.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"deviations\" style=\"margin-bottom: 40px;\">\n    <div style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #E8622A; margin-bottom: 16px;\">21 — Deviations<\u002Fdiv>\n    <h2 style=\"margin: 0 0 28px; font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em;\">Everywhere I left the brief.<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: 188px 1fr; gap: 0 24px; font-size: 14px; line-height: 1.6; align-items: start;\">\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #0A0A0A;\"><\u002Fdiv>\n      <div style=\"padding: 13px 0; font-weight: 600;\">Features card grid<\u002Fdiv>\n      <div style=\"padding: 13px 0; color: #2E2E2E;\">Tailark Mist <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">features/two<\u002Fspan> uses gapped cards with shadow. Replaced by a 1px hairline mesh (<span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">gap-px bg-border<\u002Fspan>). Reason: dark mode is forbidden shadows, so gapped cards lose all separation there; the mesh reads identically in both modes and suits sharp radii.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 13px 0; font-weight: 600;\">Hero background<\u002Fdiv>\n      <div style=\"padding: 13px 0; color: #2E2E2E;\">The sourced <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">hero-section/five<\u002Fspan> radial gradients are replaced by a token-derived hairline grid plus one <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">bg-primary/10<\u002Fspan> blur. Reason: the originals bake in palette colours and break on a theme swap; the design system also bans gradients on chrome. Its logo row is dropped as instructed (no customer logos exist, and none may be designed for).<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 13px 0; font-weight: 600;\">FAQ is two columns<\u002Fdiv>\n      <div style=\"padding: 13px 0; color: #2E2E2E;\">Veil <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">faqs/two<\u002Fspan> centres the header over a narrow accordion. Split into header-left / accordion-right. Reason: it gives the support link a home, holds answers at a 68ch measure, and stops the centred-heading pattern from appearing three times on one page.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 13px 0; font-weight: 600;\">Timeline → rail<\u002Fdiv>\n      <div style=\"padding: 13px 0; color: #2E2E2E;\">Origin UI's timeline dots-and-lines are replaced by border utilities and a mono index. Reason: its <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">radix-ui<\u002Fspan> <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">Slot.Root<\u002Fspan> had to go anyway (converted to concrete elements, no Base UI <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">render<\u002Fspan> prop needed), and a horizontal four-up rail suits a four-step install flow better than a vertical timeline, which implies duration.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 13px 0; font-weight: 600;\">Roadmap group order<\u002Fdiv>\n      <div style=\"padding: 13px 0; color: #2E2E2E;\">Rendered In progress → Planned → Exploring → Shipped, not the brief's Shipped-first order. Reason: the brief itself says In progress is the most interesting bucket and Shipped is skimmed. Putting 15 shipped rows above the 2 rows people came for buries the news. Statuses, labels, and claims are unchanged.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 13px 0; font-weight: 600;\">Dark primary ink<\u002Fdiv>\n      <div style=\"padding: 13px 0; color: #2E2E2E;\">Dark-mode <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">primaryForeground<\u002Fspan> is near-black, against the design system's \"white on the primary button, never gray\" rule. Reason: white on <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">oklch(68% 0.178 40)<\u002Fspan> is 2.6:1 and fails AA at any size. Near-black is 6.0:1. The rule's intent — never muddy grey ink on orange — is preserved.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 13px 0; font-weight: 600;\">Code panes stay dark<\u002Fdiv>\n      <div style=\"padding: 13px 0; color: #2E2E2E;\">Pane surfaces come from fixed <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">@theme<\u002Fspan> tokens, not the theme record, so they do not follow a light theme. Reason: the brief permits code-pane colours as additional non-per-theme tokens; it also means shiki highlights once at build with one theme and the client ships nothing. A light theme therefore shows dark code panes — deliberate, and consistent with the design system's \"code blocks are the hero visual\".<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 13px 0; font-weight: 600;\">CodeShowcase chrome<\u002Fdiv>\n      <div style=\"padding: 13px 0; color: #2E2E2E;\">Magic UI's <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">next-themes<\u002Fspan> dependency, filename icons, and diff highlighting are all dropped; a shared frame with one seam replaces two separate cards, and the authored pane's label is the only element carrying <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">text-primary<\u002Fspan>. Reason: this section compares two files, not two revisions, and the label colour is a cheaper \"human vs machine\" signal than any badge.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 13px 0; font-weight: 600;\">Footer sitemap<\u002Fdiv>\n      <div style=\"padding: 13px 0; color: #2E2E2E;\">Mist <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">footer/three<\u002Fspan>'s labelled multi-column groups are replaced by a single wrapping row. Reason: <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">links<\u002Fspan> is one flat array with no group field — column headings would be content the CMS cannot store.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 13px 0; font-weight: 600;\">Copy tightened<\u002Fdiv>\n      <div style=\"padding: 13px 0; color: #2E2E2E;\">Two additions, no factual change: a Features section header (\"Built for the way you already work.\" / \"Familiar collection patterns, with the generation step done for you.\") and a HowItWorks heading (\"From empty directory to live content.\"), because both blocks require <span style=\"font-family: 'Geist Mono', monospace; font-size: 0.9em;\">heading<\u002Fspan> and the brief supplies only their card copy. FAQ answers are phrased to keep versioning, drafts, live preview, and rich text explicitly unshipped, and the licence is stated as Apache-2.0 throughout — including in the design system's own README, which says MIT and is wrong.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n      <div style=\"padding: 13px 0; font-weight: 600;\">Not designed<\u002Fdiv>\n      <div style=\"padding: 13px 0; color: #2E2E2E;\">No pricing, blog, changelog, testimonials, comparison table, logo wall, star count, or download figure — and no empty slot where one could go. Quartz was not opened or referenced.<\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; border-top: 1px solid #E4E4E4;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
