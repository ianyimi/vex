name: "Quality suite setup"
description: "Checks out the audited commit and installs the toolchain shared by the axe and lighthouse jobs"

inputs:
  ref:
    description: "Commit SHA to check out"
    required: true
  playwright:
    description: "Whether to install the Playwright Chromium browser (axe suite only)"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}

    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: "pnpm"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install Playwright Chromium
      if: inputs.playwright == 'true'
      shell: bash
      run: pnpm --filter www exec playwright install --with-deps chromium
