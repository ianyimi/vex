name: quality

on:
  deployment_status

# Every Vercel project posts its own deployment_status for the same commit, so
# the group includes the environment; keyed on the SHA alone, a vex-docs event
# (whose jobs skip) cancels the in-flight vex-www run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.deployment.sha }}-${{ github.event.deployment_status.environment }}
  cancel-in-progress: true

jobs:
  axe:
    # Every Vercel project's deployment triggers this workflow, and the PR lists
    # only the newest check per name, so a skipped vex-docs job named `axe` would
    # hide the vex-www result (and would satisfy a required `axe` check).
    name: "${{ github.event.deployment_status.environment == 'Preview – vex-www' && 'axe' || format('axe (skipped: {0})', github.event.deployment_status.environment) }}"
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Preview – vex-www'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter www exec playwright install --with-deps chromium

      - name: Run axe suite against the preview
        run: pnpm --filter www exec playwright test e2e/axe.e2e.ts
        env:
          CI: "1"
          QUALITY_BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload axe results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axe-results
          path: apps/www/audit/www-axe.json
          if-no-files-found: warn
          retention-days: 14

  lighthouse:
    # Named apart for non-www deployments; see the axe job.
    name: "${{ github.event.deployment_status.environment == 'Preview – vex-www' && 'lighthouse' || format('lighthouse (skipped: {0})', github.event.deployment_status.environment) }}"
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Preview – vex-www'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Calibrate CPU throttling to this runner
        run: pnpm --filter www exec node e2e/lighthouseCpuSlowdown.cjs

      - name: Run Lighthouse CI against the preview
        run: pnpm --filter www exec lhci autorun
        env:
          CI: "1"
          QUALITY_BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Summarize Lighthouse results
        if: always()
        run: pnpm --filter www exec node e2e/lighthouseSummary.cjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: apps/www/.lighthouseci/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
