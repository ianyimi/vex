name: quality

on:
  deployment_status

# Every Vercel project posts its own deployment_status for the same commit, so
# the group includes the environment; keyed on the SHA alone, a vex-docs event
# cancels the in-flight vex-www run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.deployment.sha }}-${{ github.event.deployment_status.environment }}
  cancel-in-progress: true

# Every Vercel project's deployment triggers this workflow, and a PR lists only
# the newest check per name. So a non-www run must not reuse the names `axe` /
# `lighthouse`: it would hide the vex-www result, and a skipped job would
# satisfy a required check of that name. Each job therefore always starts (a
# job-level `if` would skip it before its `name` expression is evaluated, and
# the PR would show the raw expression), names itself after the deployment,
# and gates its steps on QUALITY_TARGET instead.
jobs:
  axe:
    name: "${{ (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Preview – vex-www') && 'axe' || format('axe (not run: {0})', github.event.deployment_status.environment) }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      QUALITY_TARGET: ${{ github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Preview – vex-www' }}
    steps:
      - name: Not the vex-www preview; nothing to audit
        if: env.QUALITY_TARGET != 'true'
        run: echo "Deployment ${{ github.event.deployment_status.environment }} (${{ github.event.deployment_status.state }}) is not audited."

      - name: Checkout
        if: env.QUALITY_TARGET == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Setup pnpm
        if: env.QUALITY_TARGET == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        if: env.QUALITY_TARGET == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        if: env.QUALITY_TARGET == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: env.QUALITY_TARGET == 'true'
        run: pnpm --filter www exec playwright install --with-deps chromium

      - name: Run axe suite against the preview
        if: env.QUALITY_TARGET == 'true'
        run: pnpm --filter www exec playwright test e2e/axe.e2e.ts
        env:
          CI: "1"
          QUALITY_BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Summarize axe results
        if: always() && env.QUALITY_TARGET == 'true'
        run: pnpm --filter www exec node e2e/axeSummary.cjs

      - name: Upload axe results
        if: always() && env.QUALITY_TARGET == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axe-results
          path: apps/www/audit/www-axe.json
          if-no-files-found: warn
          retention-days: 14

  lighthouse:
    name: "${{ (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Preview – vex-www') && 'lighthouse' || format('lighthouse (not run: {0})', github.event.deployment_status.environment) }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      QUALITY_TARGET: ${{ github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Preview – vex-www' }}
    steps:
      - name: Not the vex-www preview; nothing to audit
        if: env.QUALITY_TARGET != 'true'
        run: echo "Deployment ${{ github.event.deployment_status.environment }} (${{ github.event.deployment_status.state }}) is not audited."

      - name: Checkout
        if: env.QUALITY_TARGET == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Setup pnpm
        if: env.QUALITY_TARGET == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        if: env.QUALITY_TARGET == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        if: env.QUALITY_TARGET == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Lighthouse CI against the preview
        if: env.QUALITY_TARGET == 'true'
        run: pnpm --filter www exec lhci autorun
        env:
          CI: "1"
          QUALITY_BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Summarize Lighthouse results
        if: always() && env.QUALITY_TARGET == 'true'
        run: pnpm --filter www exec node e2e/lighthouseSummary.cjs

      - name: Upload Lighthouse reports
        if: always() && env.QUALITY_TARGET == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: apps/www/.lighthouseci/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
