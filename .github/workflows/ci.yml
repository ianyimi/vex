name: CI

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Pull requests from forks receive no secrets (see the fork build step).
      FORK_PR: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        if: env.FORK_PR != 'true'
        # `apps/test`'s public routes PRERENDER at build time (see
        # `apps/test/src/app/(frontend)/(site)/page.tsx`, which reads through the
        # cached `vex` client with `revalidate = 3600` instead of the old dynamic
        # `fetchQuery`), so `next build` performs real Convex reads.
        #
        # Placeholder values cannot satisfy that. `*.convex.cloud` resolves through
        # wildcard DNS, so a made-up subdomain answers `POST /api/query` with a
        # bodyless 404; the Convex client throws an empty-message error and Next
        # reports only `Error occurred prerendering page "/"` with a digest and no
        # cause. These therefore point at the project's real shared test deployment
        # (the same one used locally, separate from dev and prod), which answers.
        #
        # An empty deployment is fine — `getBySlug` returning `[]` reaches
        # `notFound()`, which prerenders the 404 page and does not fail the build.
        # Only unreachability breaks it.
        run: |
          for var in BETTER_AUTH_SECRET NEXT_PUBLIC_CONVEX_URL NEXT_PUBLIC_CONVEX_SITE_URL NEXT_PUBLIC_SITE_URL; do
            if [ -z "$(printenv "$var")" ]; then
              echo "::error::$var is empty. Add it under Settings → Secrets and variables → Actions → Secrets. Without it apps/test's prerender fails with an unexplained digest."
              exit 1
            fi
          done
          pnpm --filter "@vexcms/*" --filter "create-vexcms" --filter "docs" --filter "test" build
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Build Packages (fork PR, without apps/test)
        # GitHub gives `pull_request` runs from forks no secrets or variables, so
        # apps/test can't reach the shared test deployment its prerender reads.
        # Build everything else; generate apps/test's Next route types (normally a
        # side effect of `next build`) so Typecheck Packages still covers it.
        # SKIP_ENV_VALIDATION only lets next.config.ts load for typegen, which
        # makes no Convex calls. The Release workflow (push to master, with
        # secrets) builds apps/test in full once the PR merges.
        if: env.FORK_PR == 'true'
        run: |
          echo "::notice::Fork PR: secrets are unavailable, so the apps/test production build and Site Bundle Budget are skipped."
          pnpm --filter "@vexcms/*" --filter "create-vexcms" --filter "docs" build
          pnpm --filter test exec next typegen
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Check Import Cost
        run: node scripts/check-import-cost.mjs

      - name: Site Bundle Budget
        if: env.FORK_PR != 'true'
        # `next analyze` loads `apps/test/next.config.ts`, which validates the
        # app env (`src/env.mjs`) before compiling, so it needs the same
        # variables as the build above.
        run: node scripts/check-site-bundle.mjs --app apps/test
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Typecheck Packages
        run: pnpm --filter "@vexcms/*" --filter "create-vexcms" --filter "docs" --filter "test" typecheck

      - name: Test Packages
        run: pnpm --filter "@vexcms/*" --filter "create-vexcms" --filter www test

      - name: Lint
        run: pnpm lint

      - name: Check Packed Manifests
        run: node scripts/check-packed-manifests.mjs

      - name: Check Packed Manifests (packed)
        run: node scripts/check-packed-manifests.mjs --packed
