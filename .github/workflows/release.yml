name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        # `apps/test` runs `next build`, which needs env at two points: the
        # `@t3-oss/env-nextjs` parse when `next.config.ts` loads, and the Convex
        # client during prerender. Placeholder values only clear the first —
        # since its public routes became statically prerendered they perform real
        # Convex reads, and a made-up `*.convex.cloud` subdomain still resolves
        # through wildcard DNS only to answer `/api/query` with a bodyless 404,
        # which surfaces as `Error occurred prerendering page "/"` with a digest
        # and no cause. These point at the real shared test deployment instead.
        # See ci.yml for the same block and the full reasoning.
        run: |
          for var in BETTER_AUTH_SECRET NEXT_PUBLIC_CONVEX_URL NEXT_PUBLIC_CONVEX_SITE_URL NEXT_PUBLIC_SITE_URL; do
            if [ -z "$(printenv "$var")" ]; then
              echo "::error::$var is empty. Add it under Settings → Secrets and variables → Actions → Secrets."
              exit 1
            fi
          done
          pnpm --filter "@vexcms/*" --filter "create-vexcms" --filter "docs" --filter "test" build
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      # After Build, as in ci.yml: the app lint is type-aware, and packages
      # without a `source` export condition (`@vexcms/richtext-plate`) only
      # have types once `dist/` exists — before it, `plateEditor()` in
      # apps/www's vex.config.ts lints as an unresolved `error` type.
      - name: Lint
        run: pnpm lint && pnpm --filter www --filter test lint

      - name: Typecheck Packages
        run: pnpm --filter "@vexcms/*" --filter "create-vexcms" --filter "docs" --filter "test" typecheck

      - name: Test Packages
        run: pnpm --filter "@vexcms/*" --filter "create-vexcms" test

      - name: Check Packed Manifests
        run: node scripts/check-packed-manifests.mjs

      # `.npmrc` reads `_authToken=${NPM_TOKEN}`. A missing or empty repo secret is
      # substituted silently, npm sends the publish unauthenticated, and the
      # registry answers `404 Not Found - PUT` (it hides existence from callers it
      # cannot authorise) — which reads as "the package does not exist" rather than
      # "you are not logged in". Fail here, before a full build, with the real cause.
      - name: Verify npm auth
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is empty or unset — publish would fail with a misleading 404."
            exit 1
          fi
          echo "Authenticated to npm as: $(npm whoami)"
          npm access list packages 2>/dev/null | grep -E 'create-vexcms|@vexcms' || \
            echo "::warning::Could not list package permissions; a granular token scoped to @vexcms only will still 404 on the unscoped create-vexcms."
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm version:packages
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
