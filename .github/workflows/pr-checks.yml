name: PR checks

# Contributor-policy checks for pull requests from forks. Same-repo pull
# requests (the maintainer's, Dependabot's, the release PR) skip both jobs.
# Runs on `edited` too, so a title fix or a retarget re-runs them; ci.yml
# deliberately doesn't trigger on that.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - dev
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    name: PR title
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the title
        run: node scripts/check-pr-title.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  base:
    name: Base branch
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Fork pull requests target dev
        if: github.event.pull_request.base.ref == 'master'
        run: |
          echo "::error title=Base branch::Pull requests from forks go to dev, not master. Edit the pull request, change the base branch to dev, and see CONTRIBUTING.md."
          exit 1
