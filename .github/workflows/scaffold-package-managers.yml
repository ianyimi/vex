name: Scaffold package managers

# Scaffolds both create-vexcms templates from this tree's packed tarballs with every package
# manager the docs list, and runs install → typecheck → lint → build → start with that manager
# (`scripts/verify-scaffold.mjs --pm`). No Convex deployment: the sign-up/admin/save run-through
# per manager stays a release-time manual check. release.yml calls this before publishing;
# it can also be run by hand from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    # Deno and yarn 1 are best-effort (docs: quickstart § Requirements): a failure shows red on
    # its own job but doesn't fail the workflow, so it never blocks a release.
    continue-on-error: ${{ matrix.best-effort }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: npm, pm: npm, best-effort: false }
          - { label: pnpm, pm: pnpm, best-effort: false }
          - { label: yarn 4, pm: "yarn@4.19.0", best-effort: false }
          - { label: bun, pm: bun, best-effort: false }
          - { label: deno, pm: deno, best-effort: true }
          - { label: yarn 1, pm: "yarn@1.22.22", best-effort: true }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      # The scaffold pins `packageManager: yarn@<version>`; Corepack (bundled with Node 22)
      # runs exactly that yarn.
      - name: Enable Corepack (yarn)
        if: startsWith(matrix.pm, 'yarn')
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Setup Bun
        if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Deno
        if: matrix.pm == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter "@vexcms/*" --filter create-vexcms build

      - name: Scaffold, install, typecheck, lint, build, start
        run: node scripts/verify-scaffold.mjs --pm "${{ matrix.pm }}"
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
